<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FARASHOOTERS - Undertale Boss Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#050814;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;justify-content:center;align-items:center;padding:12px}
#app{width:100%;height:100%;max-width:720px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{margin:0 0 2px;font-size:24px;letter-spacing:3px}
#status{min-height:20px;margin:2px 0 6px;font-size:13px;color:#9ee7ff}
#screenWrap{width:100%;flex:1;display:flex;justify-content:center;align-items:center;min-height:0}
canvas{max-width:100%;max-height:100%;aspect-ratio:4/3;background:#02040b;border:2px solid #4b6380;border-radius:8px;image-rendering:pixelated;touch-action:none;object-fit:contain}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px;width:100%}
button{border:1px solid #60748c;border-radius:10px;background:#172235;color:#fff;padding:8px 14px;font-size:14px;min-width:90px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97);background:#263752}
.btn-danger{background:#3a171d;border-color:#8c3542}
.btn-danger:active{background:#52232a}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;width:100%;max-width:640px}
.controls button{min-width:0;font-size:20px;padding:10px 6px}
#log{margin-top:6px;text-align:left;background:#02040b;border:1px solid #28374a;border-radius:8px;padding:6px;height:60px;overflow:auto;font:11px monospace;white-space:pre-wrap;width:100%;max-width:640px}
.hint{font-size:11px;opacity:.75;margin-top:4px}

/* Fullscreen Mobile Landscape Optimization */
:fullscreen body, :-webkit-full-screen body { padding: 0; margin: 0; background: #000; }
:fullscreen #app, :-webkit-full-screen #app { width: 100vw; height: 100vh; max-width: 100vw; padding: 4px 10px; justify-content: space-between; }
:fullscreen h1, :fullscreen #status, :fullscreen .hint, :fullscreen #log, :fullscreen .row,
:-webkit-full-screen h1, :-webkit-full-screen #status, :-webkit-full-screen .hint, :-webkit-full-screen #log, :-webkit-full-screen #row { display: none; }
:fullscreen #screenWrap, :-webkit-full-screen #screenWrap { flex: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; min-height: 0; }
:fullscreen canvas, :-webkit-full-screen canvas { height: 100%; width: auto; max-width: 100%; max-height: 100%; border-radius: 4px; }
:fullscreen .controls, :-webkit-full-screen .controls { margin-top: 4px; height: 50px; max-width: 100%; }
:fullscreen .controls button, :-webkit-full-screen .controls button { padding: 6px; font-size: 24px; }

@media (orientation: landscape) and (max-height: 500px) {
  h1, #status, .hint, #log, .row { display: none; }
  #app { padding: 4px; }
  .controls { height: 48px; margin-top: 4px; }
  .controls button { padding: 4px; font-size: 20px; }
}
</style>
</head>
<body>
<div id="app">
<h1>FARASHOOTERS</h1>
<div id="status">Not connected</div>

<div id="screenWrap"><canvas id="game" width="320" height="240"></canvas></div>

<div class="row">
<button id="connect">CONNECT</button>
<button id="disconnect">DISCONNECT</button>
<button id="menuBtn" class="btn-danger">MENU</button>
<button id="fullscreenBtn">FULLSCREEN</button>
</div>

<div class="controls">
<button id="left">◀</button>
<button id="shoot">●</button>
<button id="right">▶</button>
</div>

<div class="hint">D2 = LEFT • D3 = RIGHT • D4 = SHOOT • Keyboard, Touch or ESC for Menu</div>
<div id="log">Waiting for input...</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const menuBtn = document.getElementById("menuBtn");

let port = null, reader = null, readLoopRunning = false, buffer = "";
const W = canvas.width, H = canvas.height;

// --- AUDIO SYNTHESIZER ---
let audioCtx = null, musicInterval = null, noteIndex = 0;

const noteFreqs = {
  'C3': 130.81, 'D3': 146.83, 'Eb3': 155.56, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'Ab3': 207.65, 'Bb3': 233.08,
  'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16,
  'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'Ab5': 830.61, 'Bb5': 932.33, 'REST': 0
};

const bossMelody = [
  { m: 'C5', b: 'C3' }, { m: 'G4', b: 'C3' }, { m: 'Eb4', b: 'G3' }, { m: 'G4', b: 'C3' },
  { m: 'C5', b: 'C3' }, { m: 'D5', b: 'C3' }, { m: 'Eb5', b: 'G3' }, { m: 'F5', b: 'C3' },
  { m: 'G5', b: 'Ab3' }, { m: 'Eb5', b: 'Ab3' }, { m: 'C5', b: 'Eb4' }, { m: 'Eb5', b: 'Ab3' },
  { m: 'G5', b: 'Ab3' }, { m: 'Ab5', b: 'Ab3' }, { m: 'G5', b: 'Eb4' }, { m: 'F5', b: 'Ab3' }
];

function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function playSynthNote(freq, type, duration, volume){
  if(freq <= 0 || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const sfx = {
  shoot(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
  },
  hit(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  },
  damage(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
  },
  clear(){
    if(!audioCtx) return;
    playSynthNote(noteFreqs['C5'], 'square', 0.1, 0.08);
    setTimeout(() => playSynthNote(noteFreqs['E5'], 'square', 0.1, 0.08), 80);
    setTimeout(() => playSynthNote(noteFreqs['G5'], 'square', 0.2, 0.08), 160);
  }
};

function playBossMusic(){
  initAudio(); stopBossMusic(); noteIndex = 0;
  musicInterval = setInterval(() => {
    const current = bossMelody[noteIndex];
    if(current.m && noteFreqs[current.m]) playSynthNote(noteFreqs[current.m], 'square', 0.18, 0.07);
    if(current.b && noteFreqs[current.b]) playSynthNote(noteFreqs[current.b], 'sawtooth', 0.22, 0.1);
    noteIndex = (noteIndex + 1) % bossMelody.length;
  }, 160);
}

function stopBossMusic(){
  if(musicInterval){ clearInterval(musicInterval); musicInterval = null; }
}

const inputs = { left: false, right: false };

const DIFFICULTIES = [
  { name: "EASY", speedMult: 0.7, bulletMult: 0.7, delayMult: 1.4 },
  { name: "NORMAL", speedMult: 1.0, bulletMult: 1.0, delayMult: 1.0 },
  { name: "HARD", speedMult: 1.35, bulletMult: 1.3, delayMult: 0.75 },
  { name: "BULLET HELL", speedMult: 1.7, bulletMult: 2.2, delayMult: 0.45 }
];

const game = {
  screen: "menu",
  difficultyIdx: 1,
  score: 0,
  lives: 3,
  stage: 1,
  cannons: 1,
  playerX: W / 2 - 5,
  playerY: H - 24,
  playerSpeed: 0.16,
  lastPlayerShootTime: 0,
  bullets: [],
  enemies: [],
  lasers: [],
  sabres: [],
  enemyDir: 1,
  stageClearTimer: 0,
  invulnerableUntil: 0,
  message: "",
  messageUntil: 0,
  lastTime: performance.now(),
  boss: null,
  bossMoveTimer: 0,
  bossShootTimer: 0,
  nextBossShootInterval: 2400
};

function setStatus(t){ statusEl.textContent = t; }
function log(t){
  logEl.textContent = t + "\n" + logEl.textContent;
  const lines = logEl.textContent.split("\n");
  if(lines.length > 12) logEl.textContent = lines.slice(0,12).join("\n");
}

function supported(){ return "serial" in navigator; }

async function connectArduino(){
  initAudio();
  if(!supported()){ setStatus("Web Serial not supported."); return; }
  try{
    setStatus("Selecting Arduino...");
    port = await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    setStatus("Connected"); resetGame(); readLoop();
  }catch(err){ setStatus("Connection failed"); log("ERR: "+err.message); }
}

async function disconnectArduino(){
  try{ if(reader){ await reader.cancel(); reader.releaseLock(); reader=null; } }catch(_){}
  try{ if(port) await port.close(); }catch(_){}
  port=null; setStatus("Disconnected");
}

async function readLoop(){
  if(!port || !port.readable || readLoopRunning) return;
  readLoopRunning = true;
  const decoder = new TextDecoder();
  try{
    reader = port.readable.getReader();
    while(true){
      const result = await reader.read();
      if(result.done) break;
      buffer += decoder.decode(result.value,{stream:true});
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || "";
      for(const raw of lines){
        const cmd = raw.trim().toUpperCase();
        if(cmd==="LEFT"){ 
          if(game.screen === "menu") game.difficultyIdx = (game.difficultyIdx + 3) % 4;
          else { inputs.left = true; inputs.right = false; }
        }
        else if(cmd==="RIGHT"){ 
          if(game.screen === "menu") game.difficultyIdx = (game.difficultyIdx + 1) % 4;
          else { inputs.right = true; inputs.left = false; }
        }
        else if(cmd==="RELEASE"){ inputs.left = false; inputs.right = false; }
        else if(cmd==="SHOOT") shoot();
      }
    }
  }catch(err){ if(port) log("READ ERR: "+err.message); }
  finally{ if(reader) reader.releaseLock(); reader=null; readLoopRunning=false; }
}

function returnToMenu(){
  stopBossMusic();
  game.screen = "menu";
  game.bullets = [];
  game.enemies = [];
  game.lasers = [];
  game.sabres = [];
  game.boss = null;
  inputs.left = false;
  inputs.right = false;
}

function resetGame(){
  stopBossMusic();
  game.screen="playing";
  game.score=0;
  game.lives = game.difficultyIdx === 0 ? 5 : game.difficultyIdx === 3 ? 2 : 3;
  game.stage=1;
  game.cannons=1;
  game.playerX=W/2-5;
  game.playerY=H-24;
  game.lastPlayerShootTime=0;
  game.bullets=[];
  game.lasers=[];
  game.sabres=[];
  game.invulnerableUntil=0;
  game.message="STAGE 1 (" + DIFFICULTIES[game.difficultyIdx].name + ")";
  game.messageUntil=performance.now()+1200;
  game.boss=null;
  spawnCurrentStage();
}

function getSpeedMultiplier(){
  return Math.pow(1.03, game.stage - 1) * DIFFICULTIES[game.difficultyIdx].speedMult;
}

function spawnCurrentStage(){
  game.lasers = [];
  game.sabres = [];
  if(game.stage === 4 || game.stage === 8 || game.stage === 12 || game.stage === 16 || game.stage >= 20){
    spawnBoss();
  }else{
    stopBossMusic();
    spawnStage();
  }
}

function getRandomEnemyInterval(){
  const diff = DIFFICULTIES[game.difficultyIdx];
  const difficulty = getSpeedMultiplier();
  const minInterval = Math.max(400, (2500 / difficulty) * diff.delayMult);
  const maxInterval = Math.max(1200, (7000 / difficulty) * diff.delayMult);
  return minInterval + Math.random() * (maxInterval - minInterval);
}

function spawnStage(){
  game.enemies=[];
  game.bullets=[];
  game.boss=null;
  game.enemyDir=1;
  game.stageClearTimer=0;

  const rows = Math.min(2 + Math.floor((game.stage-1)/2), 4);
  const cols = Math.min(6 + Math.floor((game.stage-1)/3), 8);
  const gapX=32, gapY=23;
  const startX=(W-(cols-1)*gapX)/2-10;
  const startY=35;

  const hasSpecialEnemies = game.stage > 4;

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      let type = "standard";
      let hp = 1;

      if(hasSpecialEnemies){
        const rand = Math.random();
        if(rand < 0.20){ type = "tank"; hp = 4; }
        else if(rand < 0.40){ type = "flash"; }
        else if(rand < 0.60){ type = "spread"; }
      }

      game.enemies.push({
        x: startX+c*gapX, y: startY+r*gapY, w: 20, h: 15,
        type: type, hp: hp, maxHp: hp, alive: true,
        shootTimer: Math.random() * 1000,
        nextShootInterval: getRandomEnemyInterval()
      });
    }
  }

  game.message = "STAGE " + game.stage;
  game.messageUntil = performance.now()+1100;
}

function spawnBoss(){
  game.enemies=[];
  game.bullets=[];
  game.lasers=[];
  game.sabres=[];
  game.stageClearTimer=0;
  game.bossMoveTimer=0;
  game.bossShootTimer=0;

  let baseHp = 360, type = "toriel", title = "TORIEL";

  if(game.stage === 8){ baseHp = 540; type = "papyrus"; title = "PAPYRUS"; }
  else if(game.stage === 12){ baseHp = 720; type = "undyne"; title = "UNDYNE THE UNDYING"; }
  else if(game.stage === 16){ baseHp = 1080; type = "sans"; title = "SANS"; }
  else if(game.stage >= 20){ baseHp = 1620; type = "asriel"; title = "ASRIEL - GOD OF HYPERDEATH"; }

  let hp = Math.floor(baseHp * (1 + 0.3 * (game.cannons - 1)));
  if(game.difficultyIdx === 3) hp = Math.floor(hp * 1.3);

  game.boss={
    type: type, x: W/2-32, y: 35, w: 64, h: 34,
    hp: hp, maxHp: hp, dir: 1, speed: 0.075 * getSpeedMultiplier(),
    spiralAngle: 0, attackPattern: 0, patternTimer: 0,
    isImmortal: false, immortalTimer: 0
  };

  game.nextBossShootInterval = 2400 * DIFFICULTIES[game.difficultyIdx].delayMult;
  game.message="STAGE " + game.stage + " • " + title;
  game.messageUntil=performance.now()+1800;

  playBossMusic();
}

function shoot(){
  initAudio();
  if(game.screen==="menu" || game.screen==="gameover" || game.screen==="won"){
    resetGame(); return;
  }
  if(game.screen!=="playing") return;

  const now = performance.now();
  if(now - game.lastPlayerShootTime < 100) return;

  if(game.bullets.filter(b=>b.owner==="player").length < 24){
    const cx = game.playerX + 5, cy = game.playerY;

    if(game.cannons === 1){
      game.bullets.push({ x: cx, y: cy, vx: 0, vy: -0.32, owner: "player" });
    } else if(game.cannons === 2){
      game.bullets.push(
        { x: cx - 3, y: cy, vx: 0, vy: -0.32, owner: "player" },
        { x: cx + 3, y: cy, vx: 0, vy: -0.32, owner: "player" }
      );
    } else if(game.cannons === 3){
      game.bullets.push(
        { x: cx - 4, y: cy, vx: -0.05, vy: -0.31, owner: "player" },
        { x: cx, y: cy, vx: 0, vy: -0.32, owner: "player" },
        { x: cx + 4, y: cy, vx: 0.05, vy: -0.31, owner: "player" }
      );
    } else {
      game.bullets.push(
        { x: cx - 6, y: cy, vx: -0.09, vy: -0.30, owner: "player" },
        { x: cx - 3, y: cy, vx: -0.04, vy: -0.32, owner: "player" },
        { x: cx, y: cy, vx: 0, vy: -0.32, owner: "player" },
        { x: cx + 3, y: cy, vx: 0.04, vy: -0.32, owner: "player" },
        { x: cx + 6, y: cy, vx: 0.09, vy: -0.30, owner: "player" }
      );
    }

    game.lastPlayerShootTime = now;
    sfx.shoot();
  }
}

function summonBossMinions(count, minionType){
  const aliveMinions = game.enemies.filter(e => e.alive).length;
  const toSummon = Math.min(count, 8 - aliveMinions);
  for(let i = 0; i < toSummon; i++){
    game.enemies.push({
      x: (W / (toSummon + 1)) * (i + 1) - 10,
      y: game.boss ? game.boss.y + game.boss.h + 10 : 50,
      w: 20, h: 15,
      type: minionType, hp: 1, maxHp: 1, alive: true,
      shootTimer: 0, nextShootInterval: getRandomEnemyInterval()
    });
  }
}

function spawnPelletCorridor(speed){
  const totalPellets = 32;
  const pelletSpacing = W / totalPellets;
  const gapWidth = 4; // Gap width in pellets (safe corridor)
  const gapStartIndex = Math.floor(Math.random() * (totalPellets - gapWidth));

  for(let i = 0; i < totalPellets; i++){
    if(i >= gapStartIndex && i < gapStartIndex + gapWidth) continue; // Leave the gap open
    game.bullets.push({
      x: i * pelletSpacing + pelletSpacing / 2,
      y: game.boss ? game.boss.y + game.boss.h : 20,
      vx: 0,
      vy: 0.13 * speed,
      owner: "sans_pellet"
    });
  }
}

function bossShoot(){
  if(!game.boss) return;
  const b = game.boss;
  const speed = getSpeedMultiplier();
  const diff = DIFFICULTIES[game.difficultyIdx];
  const centerX = b.x + b.w / 2, centerY = b.y + b.h / 2;
  let baseDelay = 2400 * diff.delayMult;

  // --- TORIEL ---
  if(b.type === "toriel"){
    const mode = b.attackPattern % 3;
    if(mode === 0){ // Hearthfire Spiral
      for(let i = 0; i < 8; i++){
        const angle = b.spiralAngle + (i * (Math.PI * 2 / 8));
        game.bullets.push({ x: centerX, y: centerY, vx: Math.cos(angle) * 0.1 * speed, vy: Math.sin(angle) * 0.1 * speed, owner: "boss" });
      }
      b.spiralAngle += 0.3;
      baseDelay = 1200 * diff.delayMult;
    } else if(mode === 1){ // Flame Rain
      for(let i = 0; i < 5; i++){
        game.bullets.push({ x: Math.random() * (W - 20) + 10, y: 10, vx: 0, vy: 0.18 * speed, owner: "boss" });
      }
      baseDelay = 1800 * diff.delayMult;
    } else { // SUMMON 2 Flame Sentinels
      summonBossMinions(2, "flame_sentinel");
      baseDelay = 3200 * diff.delayMult;
    }
    b.patternTimer++;
    if(b.patternTimer > 25){ b.patternTimer = 0; b.attackPattern++; }
  }

  // --- PAPYRUS ---
  else if(b.type === "papyrus"){
    const mode = b.attackPattern % 3;
    if(mode === 0){ // Bone Lattice Grid
      const gap = Math.floor(Math.random() * 6);
      for(let i = 0; i < 8; i++){
        if(i !== gap && i !== gap + 1){
          game.bullets.push({ x: i * 40 + 20, y: 10, vx: 0, vy: 0.14 * speed, owner: "boss" });
        }
      }
      baseDelay = 2000 * diff.delayMult;
    } else if(mode === 1){ // Bouncing Bones
      for(let vx of [-0.12, -0.04, 0.04, 0.12]){
        game.bullets.push({ x: centerX, y: centerY, vx: vx * speed, vy: 0.16 * speed, owner: "boss" });
      }
      baseDelay = 1800 * diff.delayMult;
    } else { // SUMMON 3 Guard Dogs
      summonBossMinions(3, "guard_dog");
      baseDelay = 3400 * diff.delayMult;
    }
    b.patternTimer++;
    if(b.patternTimer > 25){ b.patternTimer = 0; b.attackPattern++; }
  }

  // --- UNDYNE ---
  else if(b.type === "undyne"){
    const mode = b.attackPattern % 3;
    if(mode === 0){ // Spear Matrix
      const offsets = [-0.08, -0.04, 0, 0.04, 0.08];
      for(const vx of offsets){
        game.bullets.push({ x: centerX, y: b.y + b.h, vx: vx * speed, vy: 0.22 * speed, owner: "undyne_spear" });
      }
      baseDelay = 1600 * diff.delayMult;
    } else if(mode === 1){ // Spear Ring
      for(let a = 0; a < 8; a++){
        const angle = (a / 8) * Math.PI * 2;
        game.bullets.push({ x: centerX, y: centerY, vx: Math.cos(angle) * 0.12 * speed, vy: Math.sin(angle) * 0.12 * speed, owner: "boss" });
      }
      baseDelay = 2200 * diff.delayMult;
    } else { // SUMMON 4 Royal Spearsmen
      summonBossMinions(4, "royal_spearsman");
      baseDelay = 3600 * diff.delayMult;
    }
    b.patternTimer++;
    if(b.patternTimer > 25){ b.patternTimer = 0; b.attackPattern++; }
  }

  // --- SANS ---
  else if(b.type === "sans"){
    const mode = b.attackPattern % 4;
    if(mode === 0){ // White Pellet Corridor (Continuous Bone Row)
      spawnPelletCorridor(speed);
      game.message = "PELLET CORRIDOR - FIND THE GAP!";
      game.messageUntil = performance.now() + 1000;
      baseDelay = 1600 * diff.delayMult;
    } else if(mode === 1){ // Gaster Blaster Lasers
      game.lasers.push({ x: game.playerX - 10, y: 0, w: 30, h: H, timer: 1400, warning: true });
      baseDelay = 2600 * diff.delayMult;
    } else if(mode === 2){ // Bone Wall Burst
      const gapIndex = Math.floor(Math.random() * 8);
      for(let i = 0; i < 10; i++){
        if(i !== gapIndex){
          game.bullets.push({ x: i * 32 + 16, y: b.y + b.h, vx: 0, vy: 0.14 * speed, owner: "boss" });
        }
      }
      baseDelay = 2000 * diff.delayMult;
    } else { // SUMMON 5 Phantom Blasters
      summonBossMinions(5, "phantom_blaster");
      baseDelay = 3800 * diff.delayMult;
    }
    b.patternTimer++;
    if(b.patternTimer > 25){ b.patternTimer = 0; b.attackPattern++; }
  }

  // --- ASRIEL ---
  else if(b.type === "asriel"){
    const mode = b.attackPattern % 4;
    if(mode === 0){ // Targeted Chaos Sabre Strike
      game.sabres.push({
        targetX: game.playerX + 5,
        targetY: game.playerY + 5,
        timer: 900,
        slashing: false
      });
      baseDelay = 2200 * diff.delayMult;
    } else if(mode === 1){ // Starburst Cluster
      for(let i = 0; i < 6; i++){
        game.bullets.push({ x: Math.random() * (W - 20) + 10, y: 10, vx: (Math.random() - 0.5) * 0.05, vy: 0.14 * speed, owner: "asriel_star" });
      }
      baseDelay = 1800 * diff.delayMult;
    } else if(mode === 2){ // Dual Lasers
      game.lasers.push(
        { x: 20, y: 0, w: 25, h: H, timer: 1200, warning: true },
        { x: W - 45, y: 0, w: 25, h: H, timer: 1200, warning: true }
      );
      baseDelay = 2600 * diff.delayMult;
    } else { // SUMMON 6 Astral Entities
      summonBossMinions(6, "astral_entity");
      baseDelay = 4000 * diff.delayMult;
    }
    b.patternTimer++;
    if(b.patternTimer > 25){ b.patternTimer = 0; b.attackPattern++; }
  }

  game.nextBossShootInterval = baseDelay;
}

function hit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function getPlayerHitbox(){
  return { x: game.playerX + 3, y: game.playerY + 2, w: 4, h: 4 };
}

function loseLife(){
  const now=performance.now();
  if(now < game.invulnerableUntil) return;
  game.lives--;
  sfx.damage();
  game.invulnerableUntil=now+1200;
  game.message="HIT! LIVES: " + game.lives;
  game.messageUntil=now+900;

  if(game.lives<=0){
    game.lives=0; game.screen="gameover"; stopBossMusic();
  }
}

function updateEnemies(dt){
  const speed = getSpeedMultiplier();
  const alive = game.enemies.filter(e => e.alive);

  if(alive.length && !game.boss){
    let minX = Math.min(...alive.map(e => e.x));
    let maxX = Math.max(...alive.map(e => e.x));
    const step = 0.035 * speed * dt * game.enemyDir;

    if(maxX >= W - 24 && game.enemyDir > 0){
      game.enemyDir = -1;
      alive.forEach(e => e.y += 6);
    } else if(minX <= 4 && game.enemyDir < 0){
      game.enemyDir = 1;
      alive.forEach(e => e.y += 6);
    } else {
      alive.forEach(e => e.x += step);
    }
  }

  for(const e of game.enemies){
    if(!e.alive) continue;
    e.shootTimer += dt;
    if(e.shootTimer >= e.nextShootInterval){
      e.shootTimer = 0;
      e.nextShootInterval = getRandomEnemyInterval();

      if(e.type === "flame_sentinel"){
        game.bullets.push({ x: e.x + 10, y: e.y + 14, vx: (game.playerX - e.x) * 0.0005 * speed, vy: 0.12 * speed, owner: "boss" });
      } else if(e.type === "guard_dog"){
        game.bullets.push({ x: e.x + 10, y: e.y + 14, vx: 0, vy: 0.22 * speed, owner: "boss" });
      } else if(e.type === "royal_spearsman"){
        game.bullets.push({ x: e.x + 10, y: e.y + 14, vx: 0, vy: 0.25 * speed, owner: "undyne_spear" });
      } else if(e.type === "phantom_blaster"){
        game.lasers.push({ x: e.x - 5, y: 0, w: 12, h: H, timer: 800, warning: true });
      } else if(e.type === "astral_entity"){
        const angle = Math.atan2(game.playerY - e.y, game.playerX - e.x);
        game.bullets.push({ x: e.x + 10, y: e.y + 14, vx: Math.cos(angle) * 0.15 * speed, vy: Math.sin(angle) * 0.15 * speed, owner: "asriel_star" });
      } else if(e.type === "flash"){
        game.bullets.push({ x: e.x + 10, y: e.y + 14, vx: 0, vy: 0.28 * speed, owner: "enemy" });
      } else if(e.type === "spread"){
        game.bullets.push(
          { x: e.x + 10, y: e.y + 14, vx: -0.06 * speed, vy: 0.14 * speed, owner: "enemy" },
          { x: e.x + 10, y: e.y + 14, vx: 0, vy: 0.14 * speed, owner: "enemy" },
          { x: e.x + 10, y: e.y + 14, vx: 0.06 * speed, vy: 0.14 * speed, owner: "enemy" }
        );
      } else {
        game.bullets.push({ x: e.x + 10, y: e.y + 14, vx: 0, vy: 0.14 * speed, owner: "enemy" });
      }
    }
  }
}

function updateLasers(dt){
  const pr = getPlayerHitbox();
  for(let i = game.lasers.length - 1; i >= 0; i--){
    const l = game.lasers[i];
    l.timer -= dt;

    if(l.timer < 300) {
      l.warning = false;
      if(hit(pr, { x: l.x, y: l.y, w: l.w, h: l.h })){
        loseLife();
      }
    }

    if(l.timer <= 0) game.lasers.splice(i, 1);
  }
}

function updateSabres(dt){
  const pr = getPlayerHitbox();
  const speed = getSpeedMultiplier();
  for(let i = game.sabres.length - 1; i >= 0; i--){
    const s = game.sabres[i];
    s.timer -= dt;

    if(s.timer < 300 && !s.slashing){
      s.slashing = true;
      sfx.hit();
      // Execute 4-way cross blasts radiating from the slash target
      const directions = [
        { vx: 0, vy: -0.18 }, { vx: 0, vy: 0.18 },
        { vx: -0.18, vy: 0 }, { vx: 0.18, vy: 0 }
      ];
      for(const d of directions){
        game.bullets.push({
          x: s.targetX, y: s.targetY,
          vx: d.vx * speed, vy: d.vy * speed,
          owner: "asriel_star"
        });
      }
    }

    if(s.slashing){
      const slashArea = { x: s.targetX - 15, y: s.targetY - 15, w: 30, h: 30 };
      if(hit(pr, slashArea)){ loseLife(); }
    }

    if(s.timer <= 0) game.sabres.splice(i, 1);
  }
}

function killBoss(){
  game.boss=null;
  game.bullets=[];
  game.enemies=[];
  game.lasers=[];
  game.sabres=[];
  stopBossMusic();
  sfx.clear();
  game.stageClearTimer=performance.now()+1500;
  game.cannons++;

  if(game.stage >= 20){
    game.screen = "won";
  } else {
    game.message="BOSS DEFEATED! CANNON UPGRADED!";
    game.messageUntil=performance.now()+1400;
  }
}

function update(dt){
  if(game.screen!=="playing") return;

  if(inputs.left) game.playerX -= game.playerSpeed * dt;
  if(inputs.right) game.playerX += game.playerSpeed * dt;

  game.playerX = Math.max(0, Math.min(W - 10, game.playerX));
  game.playerY = Math.max(15, Math.min(H - 24, game.playerY));

  updateLasers(dt);
  updateSabres(dt);

  if(game.boss){
    const b=game.boss;
    const moveSpeed = b.isImmortal ? b.speed * 2.0 : b.speed;
    b.x += b.dir * moveSpeed * dt;

    if(b.x <= 4){ b.x=4; b.dir=1; }
    else if(b.x+b.w >= W-4){ b.x=W-4-b.w; b.dir=-1; }

    if(b.isImmortal){
      b.immortalTimer -= dt;
      if(b.immortalTimer <= 0){ killBoss(); return; }
    }

    game.bossShootTimer += dt;
    if(game.bossShootTimer >= game.nextBossShootInterval){
      game.bossShootTimer = 0;
      bossShoot();
    }
  }

  updateEnemies(dt);

  for(const bullet of game.bullets){
    bullet.x += (bullet.vx || 0) * dt;
    bullet.y += bullet.vy * dt;

    if(bullet.owner === "asriel_star" && bullet.y > H * 0.45 && !bullet.split){
      bullet.split = true;
      const count = game.difficultyIdx === 3 ? 6 : 4;
      for(let a=0; a<count; a++){
        const ang = a * (Math.PI * 2 / count);
        game.bullets.push({
          x: bullet.x, y: bullet.y,
          vx: Math.cos(ang) * 0.08 * getSpeedMultiplier(),
          vy: Math.sin(ang) * 0.08 * getSpeedMultiplier(),
          owner: "boss"
        });
      }
    }
  }
  game.bullets=game.bullets.filter(bullet=>bullet.x > -20 && bullet.x < W+20 && bullet.y > -20 && bullet.y < H+20);

  const pr = getPlayerHitbox();

  for(const bullet of game.bullets){
    if(bullet.owner==="player") continue;
    let br = bullet.owner === "undyne_spear" 
      ? { x: bullet.x - 4, y: bullet.y, w: 8, h: 20 }
      : bullet.owner === "sans_pellet"
      ? { x: bullet.x - 3, y: bullet.y - 3, w: 6, h: 6 }
      : { x: bullet.x - 2, y: bullet.y - 2, w: 4, h: 4 };

    if(hit(br, pr)){ loseLife(); }
  }

  for(const bullet of game.bullets){
    if(bullet.owner!=="player") continue;
    const br={x:bullet.x-1,y:bullet.y-5,w:2,h:7};

    if(game.boss && hit(br, game.boss)){
      bullet.y = -30;
      if(!game.boss.isImmortal){
        game.boss.hp--;
        game.score += 25;
        sfx.hit();

        if(game.boss.hp <= 0){
          if(game.boss.type === "undyne" && !game.boss.isImmortal){
            game.boss.hp = 0;
            game.boss.isImmortal = true;
            game.boss.immortalTimer = 10000;
            game.message = "UNDYNE REFUSES TO DIE! (10s)";
            game.messageUntil = performance.now() + 2000;
          } else {
            killBoss();
          }
        }
      }
      continue;
    }

    for(const e of game.enemies){
      if(!e.alive) continue;
      if(hit(br, e)){
        bullet.y = -30;
        e.hp--;
        sfx.hit();
        if(e.hp <= 0){
          e.alive = false;
          game.score += e.type === "tank" ? 40 : e.type === "standard" ? 10 : 20;
        }
        break;
      }
    }
  }

  for(const e of game.enemies){
    if(!e.alive) continue;
    if(e.y+e.h >= game.playerY){ e.alive=false; loseLife(); continue; }
    if(hit(pr, e)){ loseLife(); }
  }

  game.enemies = game.enemies.filter(e => e.alive);

  if(!game.boss && game.enemies.length === 0 && game.stageClearTimer === 0){
    sfx.clear();
    game.stageClearTimer = performance.now() + 1200;
    game.message = "STAGE CLEAR!";
    game.messageUntil = performance.now() + 1100;
  }

  if(game.stageClearTimer && performance.now() >= game.stageClearTimer){
    game.stageClearTimer = 0;
    game.stage++;
    game.lives++;
    spawnCurrentStage();
  }
}

function clearScreen(){
  ctx.fillStyle="#02040b";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#24364d";
  for(let i=0;i<45;i++){
    ctx.fillRect((i*73)%W, (i*47)%H, 1, 1);
  }
}

function text(t,x,y,size=12,align="left",color="#fff"){
  ctx.fillStyle=color; ctx.font=`${size}px monospace`; ctx.textAlign=align; ctx.fillText(t,x,y);
}

function drawPlayer(){
  if(performance.now()<game.invulnerableUntil && Math.floor(performance.now()/100)%2===0) return;
  const x=game.playerX,y=game.playerY;

  ctx.fillStyle = "#70e8ff";
  ctx.beginPath();
  ctx.moveTo(x+5, y); ctx.lineTo(x+10, y+8); ctx.lineTo(x+7, y+6);
  ctx.lineTo(x+5, y+8); ctx.lineTo(x+3, y+6); ctx.lineTo(x, y+8);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle="#ffff55";
  if(game.cannons >= 2){ ctx.fillRect(x, y+3, 1, 3); ctx.fillRect(x+9, y+3, 1, 3); }
  if(game.cannons >= 3){ ctx.fillRect(x+4, y-1, 2, 2); }

  ctx.fillStyle="#ff2255";
  ctx.fillRect(x+4, y+3, 2, 2);
}

function drawEnemy(e){
  const x = e.x, y = e.y;

  if(e.type === "flame_sentinel"){
    ctx.fillStyle = "#ff6600"; ctx.fillRect(x+4, y+2, 12, 11);
    ctx.fillStyle = "#ffff00"; ctx.fillRect(x+7, y+5, 6, 5);
  } else if(e.type === "guard_dog"){
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x+2, y+2, 16, 10);
    ctx.fillStyle = "#000000"; ctx.fillRect(x+5, y+5, 3, 3); ctx.fillRect(x+12, y+5, 3, 3);
  } else if(e.type === "royal_spearsman"){
    ctx.fillStyle = "#00aaff"; ctx.fillRect(x, y, 20, 15);
    ctx.fillStyle = "#ffff00"; ctx.fillRect(x+8, y+3, 4, 9);
  } else if(e.type === "phantom_blaster"){
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x+3, y+1, 14, 13);
    ctx.fillStyle = "#ff0000"; ctx.fillRect(x+6, y+4, 3, 3); ctx.fillRect(x+11, y+4, 3, 3);
  } else if(e.type === "astral_entity"){
    ctx.fillStyle = "#e6a1ff"; ctx.fillRect(x+2, y+2, 16, 11);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x+8, y+5, 4, 5);
  } else if(e.type === "tank"){
    ctx.fillStyle = "#8899a6"; ctx.fillRect(x+1, y, 18, 14);
    ctx.fillStyle = "#ff6600"; ctx.fillRect(x+4, y+3, 12, 8);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x+7, y-2, 6, 4);
  } else if(e.type === "flash"){
    ctx.fillStyle = "#ff2255"; ctx.fillRect(x+2, y+2, 16, 10);
    ctx.fillStyle = "#ffff00"; ctx.fillRect(x+8, y+8, 4, 7);
  } else if(e.type === "spread"){
    ctx.fillStyle = "#aa00ff"; ctx.fillRect(x, y+3, 20, 8);
    ctx.fillStyle = "#00ffff"; ctx.fillRect(x+2, y+11, 3, 4);
    ctx.fillRect(x+8, y+11, 4, 4); ctx.fillRect(x+15, y+11, 3, 4);
  } else {
    ctx.fillStyle="#ff647c";
    ctx.fillRect(x+4,y,12,3); ctx.fillRect(x+2,y+3,16,8);
    ctx.fillRect(x,y+6,4,5); ctx.fillRect(x+16,y+6,4,5);
    ctx.fillRect(x+5,y+11,3,4); ctx.fillRect(x+12,y+11,3,4);
    ctx.fillStyle="#050814"; ctx.fillRect(x+5,y+5,3,3); ctx.fillRect(x+12,y+5,3,3);
  }

  if(e.type === "tank" && e.hp < e.maxHp){
    ctx.fillStyle="#333"; ctx.fillRect(x, y-5, 20, 2);
    ctx.fillStyle="#00ff66"; ctx.fillRect(x, y-5, 20 * (e.hp / e.maxHp), 2);
  }
}

function drawLasers(){
  for(const l of game.lasers){
    if(l.warning){
      ctx.fillStyle = "rgba(255, 0, 0, 0.25)";
      ctx.fillRect(l.x, l.y, l.w, l.h);
      text("WARNING!", l.x + l.w/2, 120, 9, "center", "#ff3355");
    } else {
      ctx.fillStyle = "#ffffff"; ctx.fillRect(l.x, l.y, l.w, l.h);
      ctx.fillStyle = "#00ffff"; ctx.fillRect(l.x + 3, l.y, l.w - 6, l.h);
    }
  }
}

function drawSabres(){
  for(const s of game.sabres){
    if(!s.slashing){
      ctx.strokeStyle = "rgba(255, 0, 85, 0.6)";
      ctx.lineWidth = 1;
      ctx.strokeRect(s.targetX - 15, s.targetY - 15, 30, 30);
      text("⚔", s.targetX, s.targetY + 4, 12, "center", "#ff0055");
    } else {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(s.targetX - 15, s.targetY - 15, 30, 30);
      ctx.fillStyle = "#e6a1ff";
      ctx.fillRect(s.targetX - 10, s.targetY - 10, 20, 20);
    }
  }
}

function drawBullet(b){
  if(b.owner==="undyne_spear"){
    ctx.fillStyle = "#00ffff";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + 20); ctx.lineTo(b.x - 4, b.y + 6);
    ctx.lineTo(b.x - 2, b.y + 6); ctx.lineTo(b.x - 2, b.y);
    ctx.lineTo(b.x + 2, b.y); ctx.lineTo(b.x + 2, b.y + 6);
    ctx.lineTo(b.x + 4, b.y + 6); ctx.closePath(); ctx.fill();
  }else if(b.owner==="sans_pellet"){
    ctx.fillStyle="#ffffff";
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
  }else if(b.owner==="boss"){
    ctx.fillStyle="#ff8800";
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
  }else if(b.owner==="asriel_star"){
    ctx.fillStyle="#ffff55";
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
  }else{
    ctx.fillStyle=b.owner==="player" ? "#fff28a" : "#ff647c";
    ctx.fillRect(b.x-1,b.y-5,2,7);
  }
}

function drawBoss(b){
  if(b.type === "toriel") ctx.fillStyle = "#ffaa00";
  else if(b.type === "papyrus") ctx.fillStyle = "#ffffff";
  else if(b.type === "undyne") ctx.fillStyle = b.isImmortal ? "#ff0055" : "#00aaff";
  else if(b.type === "sans") ctx.fillStyle = "#0066ff";
  else if(b.type === "asriel") ctx.fillStyle = "#e6a1ff";

  ctx.fillRect(b.x+8,b.y+5,b.w-16,b.h-10);
  ctx.fillRect(b.x+16,b.y,b.w-32,5);
  ctx.fillRect(b.x,b.y+12,10,12);
  ctx.fillRect(b.x+b.w-10,b.y+12,10,12);

  ctx.fillStyle="#000";
  ctx.fillRect(b.x+17,b.y+11,8,7); ctx.fillRect(b.x+b.w-25,b.y+11,8,7);

  if(!b.isImmortal){
    ctx.fillStyle="#42152b"; ctx.fillRect(b.x,b.y-9,b.w,4);
    ctx.fillStyle="#ff647c"; ctx.fillRect(b.x,b.y-9,b.w*(b.hp/b.maxHp),4);
  } else {
    text("IMMORTAL: " + Math.ceil(b.immortalTimer / 1000) + "s", b.x + b.w/2, b.y - 8, 10, "center");
  }
}

function drawHUD(){
  text("SCORE "+game.score,8,14,11);
  text("LIVES "+game.lives,120,14,11,"center");
  text("CANNONS "+game.cannons,210,14,11,"center","#ffff55");
  text("STAGE "+game.stage,312,14,11,"right");
  if(game.boss){
    text("BOSS HP "+game.boss.hp+"/"+game.boss.maxHp,160,229,10,"center");
  }else{
    text("ENEMIES "+game.enemies.length,160,229,10,"center");
  }
}

function overlay(title,subtitle){
  ctx.fillStyle="rgba(0,0,0,.72)"; ctx.fillRect(0,0,W,H);
  text(title,160,90,24,"center"); text(subtitle,160,120,12,"center");
}

function draw(){
  clearScreen();

  if(game.screen==="menu"){
    text("FARASHOOTERS",160,45,22,"center");
    text("UNDERTALE BOSS EDITION",160,62,10,"center");

    text("SELECT DIFFICULTY:",160,95,11,"center","#9ee7ff");

    DIFFICULTIES.forEach((d, i) => {
      const selected = i === game.difficultyIdx;
      const prefix = selected ? "► " : "  ", suffix = selected ? " ◄" : "  ";
      const color = selected ? (i === 3 ? "#ff3355" : "#ffff55") : "#888888";
      text(prefix + d.name + suffix, 160, 120 + i * 20, 13, "center", color);
    });

    text("◀ / ▶ : CHANGE DIFFICULTY",160,210,9,"center");
    text("PRESS SHOOT TO START",160,225,11,"center","#ffffff");
  }else{
    drawHUD();
    drawLasers();
    drawSabres();
    for(const e of game.enemies) drawEnemy(e);
    if(game.boss) drawBoss(game.boss);
    for(const b of game.bullets) drawBullet(b);
    drawPlayer();

    if(game.messageUntil>performance.now()){
      text(game.message,160,110,15,"center");
    }
    if(game.screen==="gameover") overlay("GAME OVER","Press SHOOT to restart");
    if(game.screen==="won") overlay("YOU WIN!","Press SHOOT to return to menu");
  }
}

function loop(now){
  const dt=Math.min(40,now-game.lastTime);
  game.lastTime=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function setupTouch(btnId, key){
  const btn = document.getElementById(btnId);
  btn.addEventListener("pointerdown", e => { 
    e.preventDefault(); initAudio(); 
    if(game.screen === "menu"){
      if(key === "left") game.difficultyIdx = (game.difficultyIdx + 3) % 4;
      if(key === "right") game.difficultyIdx = (game.difficultyIdx + 1) % 4;
    } else { inputs[key] = true; }
  });
  btn.addEventListener("pointerup", e => { e.preventDefault(); inputs[key] = false; });
  btn.addEventListener("pointercancel", e => { e.preventDefault(); inputs[key] = false; });
  btn.addEventListener("pointerleave", e => { e.preventDefault(); inputs[key] = false; });
}

setupTouch("left", "left");
setupTouch("right", "right");
document.getElementById("shoot").addEventListener("pointerdown", e => { e.preventDefault(); shoot(); });
document.getElementById("connect").addEventListener("click", connectArduino);
document.getElementById("disconnect").addEventListener("click", disconnectArduino);
menuBtn.addEventListener("click", returnToMenu);

fullscreenBtn.addEventListener("click", async () => {
  initAudio();
  const elem = document.getElementById("app");
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) await elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) await elem.webkitRequestFullscreen();
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
  } else {
    if (document.exitFullscreen) await document.exitFullscreen();
    else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }
});

document.addEventListener("keydown", e => {
  initAudio();
  if(e.key === "Escape"){
    returnToMenu();
  }
  if(e.key === "ArrowLeft"){ 
    e.preventDefault(); 
    if(game.screen === "menu") game.difficultyIdx = (game.difficultyIdx + 3) % 4;
    else inputs.left = true; 
  }
  if(e.key === "ArrowRight"){ 
    e.preventDefault(); 
    if(game.screen === "menu") game.difficultyIdx = (game.difficultyIdx + 1) % 4;
    else inputs.right = true; 
  }
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); shoot(); }
});

document.addEventListener("keyup", e => {
  if(e.key === "ArrowLeft") inputs.left = false;
  if(e.key === "ArrowRight") inputs.right = false;
});

requestAnimationFrame(loop);
</script>
</body>
</html>
