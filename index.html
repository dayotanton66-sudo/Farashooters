<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FARASHOOTERS - Undertale Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#050814;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;justify-content:center;align-items:center;padding:12px}
#app{width:100%;height:100%;max-width:720px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{margin:0 0 2px;font-size:24px;letter-spacing:3px}
#status{min-height:20px;margin:2px 0 6px;font-size:13px;color:#9ee7ff}
#screenWrap{width:100%;flex:1;display:flex;justify-content:center;align-items:center;min-height:0}
canvas{max-width:100%;max-height:100%;aspect-ratio:4/3;background:#02040b;border:2px solid #4b6380;border-radius:8px;image-rendering:pixelated;touch-action:none;object-fit:contain}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px;width:100%}
button{border:1px solid #60748c;border-radius:10px;background:#172235;color:#fff;padding:8px 14px;font-size:14px;min-width:90px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97);background:#263752}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;width:100%;max-width:640px}
.controls button{min-width:0;font-size:20px;padding:10px 6px}
#log{margin-top:6px;text-align:left;background:#02040b;border:1px solid #28374a;border-radius:8px;padding:6px;height:60px;overflow:auto;font:11px monospace;white-space:pre-wrap;width:100%;max-width:640px}
.hint{font-size:11px;opacity:.75;margin-top:4px}

/* Fullscreen Mobile Landscape Optimization */
:fullscreen body, :-webkit-full-screen body {
  padding: 0;
  margin: 0;
  background: #000;
}
:fullscreen #app, :-webkit-full-screen #app {
  width: 100vw;
  height: 100vh;
  max-width: 100vw;
  padding: 4px 10px;
  justify-content: space-between;
}
:fullscreen h1, :fullscreen #status, :fullscreen .hint, :fullscreen #log, :fullscreen .row,
:-webkit-full-screen h1, :-webkit-full-screen #status, :-webkit-full-screen .hint, :-webkit-full-screen #log, :-webkit-full-screen .row {
  display: none;
}
:fullscreen #screenWrap, :-webkit-full-screen #screenWrap {
  flex: 1;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 0;
}
:fullscreen canvas, :-webkit-full-screen canvas {
  height: 100%;
  width: auto;
  max-width: 100%;
  max-height: 100%;
  border-radius: 4px;
}
:fullscreen .controls, :-webkit-full-screen .controls {
  margin-top: 4px;
  height: 50px;
  max-width: 100%;
}
:fullscreen .controls button, :-webkit-full-screen .controls button {
  padding: 6px;
  font-size: 24px;
}

@media (orientation: landscape) and (max-height: 500px) {
  h1, #status, .hint, #log, .row { display: none; }
  #app { padding: 4px; }
  .controls { height: 48px; margin-top: 4px; }
  .controls button { padding: 4px; font-size: 20px; }
}
</style>
</head>
<body>
<div id="app">
<h1>FARASHOOTERS</h1>
<div id="status">Not connected</div>

<div id="screenWrap"><canvas id="game" width="320" height="240"></canvas></div>

<div class="row">
<button id="connect">CONNECT</button>
<button id="disconnect">DISCONNECT</button>
<button id="fullscreenBtn">FULLSCREEN</button>
</div>

<div class="controls">
<button id="left">◀</button>
<button id="shoot">●</button>
<button id="right">▶</button>
</div>

<div class="hint">D2 = LEFT • D3 = RIGHT • D4 = SHOOT • Keyboard or Touch controls work</div>
<div id="log">Waiting for input...</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const fullscreenBtn = document.getElementById("fullscreenBtn");

let port = null;
let reader = null;
let readLoopRunning = false;
let buffer = "";

const W = canvas.width, H = canvas.height;

// --- WEB AUDIO SYNTHESIZER ---
let audioCtx = null;
let musicInterval = null;
let noteIndex = 0;

const noteFreqs = {
  'C3': 130.81, 'D3': 146.83, 'Eb3': 155.56, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'Ab3': 207.65, 'Bb3': 233.08,
  'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16,
  'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'Ab5': 830.61, 'Bb5': 932.33,
  'REST': 0
};

const bossMelody = [
  { m: 'C5', b: 'C3' }, { m: 'G4', b: 'C3' }, { m: 'Eb4', b: 'G3' }, { m: 'G4', b: 'C3' },
  { m: 'C5', b: 'C3' }, { m: 'D5', b: 'C3' }, { m: 'Eb5', b: 'G3' }, { m: 'F5', b: 'C3' },
  { m: 'G5', b: 'Ab3' }, { m: 'Eb5', b: 'Ab3' }, { m: 'C5', b: 'Eb4' }, { m: 'Eb5', b: 'Ab3' },
  { m: 'G5', b: 'Ab3' }, { m: 'Ab5', b: 'Ab3' }, { m: 'G5', b: 'Eb4' }, { m: 'F5', b: 'Ab3' }
];

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function playSynthNote(freq, type, duration, volume){
  if(freq <= 0 || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const sfx = {
  shoot(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  },
  hit(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  },
  damage(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  },
  clear(){
    if(!audioCtx) return;
    playSynthNote(noteFreqs['C5'], 'square', 0.1, 0.08);
    setTimeout(() => playSynthNote(noteFreqs['E5'], 'square', 0.1, 0.08), 80);
    setTimeout(() => playSynthNote(noteFreqs['G5'], 'square', 0.2, 0.08), 160);
  }
};

function playBossMusic(){
  initAudio();
  stopBossMusic();
  noteIndex = 0;
  musicInterval = setInterval(() => {
    const current = bossMelody[noteIndex];
    if(current.m && noteFreqs[current.m]){
      playSynthNote(noteFreqs[current.m], 'square', 0.18, 0.07);
    }
    if(current.b && noteFreqs[current.b]){
      playSynthNote(noteFreqs[current.b], 'sawtooth', 0.22, 0.1);
    }
    noteIndex = (noteIndex + 1) % bossMelody.length;
  }, 160);
}

function stopBossMusic(){
  if(musicInterval){
    clearInterval(musicInterval);
    musicInterval = null;
  }
}

const inputs = { left: false, right: false };

const DIFFICULTIES = [
  { name: "EASY", speedMult: 0.7, bulletMult: 0.7, delayMult: 1.4 },
  { name: "NORMAL", speedMult: 1.0, bulletMult: 1.0, delayMult: 1.0 },
  { name: "HARD", speedMult: 1.35, bulletMult: 1.3, delayMult: 0.75 },
  { name: "BULLET HELL", speedMult: 1.7, bulletMult: 2.2, delayMult: 0.45 }
];

const game = {
  screen: "menu",
  difficultyIdx: 1, // Default Normal
  score: 0,
  lives: 3,
  stage: 1,
  playerX: W / 2 - 8,
  playerY: H - 28,
  playerSpeed: 0.16,
  lastPlayerShootTime: 0,
  bullets: [],
  enemies: [],
  minions: [],
  swords: [],
  enemyDir: 1,
  stageClearTimer: 0,
  invulnerableUntil: 0,
  message: "",
  messageUntil: 0,
  lastTime: performance.now(),
  boss: null,
  bossMoveTimer: 0,
  bossShootTimer: 0,
  nextBossShootInterval: 600
};

function setStatus(t){ statusEl.textContent = t; }
function log(t){
  logEl.textContent = t + "\n" + logEl.textContent;
  const lines = logEl.textContent.split("\n");
  if(lines.length > 12) logEl.textContent = lines.slice(0,12).join("\n");
}

function supported(){ return "serial" in navigator; }

async function connectArduino(){
  initAudio();
  if(!supported()){
    setStatus("Web Serial is not available.");
    log("Use a browser that supports Web Serial.");
    return;
  }
  try{
    setStatus("Choose the Arduino...");
    port = await navigator.serial.requestPort();
    await port.open({baudRate:115200,dataBits:8,stopBits:1,parity:"none",flowControl:"none"});
    setStatus("Connected • Stage 1 • Lives 3");
    log("Serial opened at 115200 baud.");
    resetGame();
    readLoop();
  }catch(err){
    setStatus("Connection failed");
    log("ERROR: " + err.message);
  }
}

async function disconnectArduino(){
  try{
    if(reader){ await reader.cancel(); reader.releaseLock(); reader=null; }
  }catch(_){}
  try{ if(port) await port.close(); }catch(_){}
  port=null;
  setStatus("Disconnected");
  log("Serial disconnected.");
}

async function readLoop(){
  if(!port || !port.readable || readLoopRunning) return;
  readLoopRunning = true;
  const decoder = new TextDecoder();
  try{
    reader = port.readable.getReader();
    while(true){
      const result = await reader.read();
      if(result.done) break;
      buffer += decoder.decode(result.value,{stream:true});
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || "";
      for(const raw of lines){
        const cmd = raw.trim().toUpperCase();
        if(cmd==="LEFT"){ 
          if(game.screen === "menu"){
            game.difficultyIdx = (game.difficultyIdx + 3) % 4;
          } else {
            inputs.left = true; inputs.right = false; 
          }
        }
        else if(cmd==="RIGHT"){ 
          if(game.screen === "menu"){
            game.difficultyIdx = (game.difficultyIdx + 1) % 4;
          } else {
            inputs.right = true; inputs.left = false; 
          }
        }
        else if(cmd==="RELEASE"){ inputs.left = false; inputs.right = false; }
        else if(cmd==="SHOOT") shoot();
      }
    }
  }catch(err){
    if(port) log("READ ERROR: " + err.message);
  }finally{
    try{ if(reader) reader.releaseLock(); }catch(_){}
    reader=null;
    readLoopRunning=false;
  }
}

function resetGame(){
  stopBossMusic();
  game.screen="playing";
  game.score=0;
  game.lives = game.difficultyIdx === 0 ? 5 : game.difficultyIdx === 3 ? 2 : 3;
  game.stage=1;
  game.playerX=W/2-8;
  game.lastPlayerShootTime=0;
  game.bullets=[];
  game.minions=[];
  game.swords=[];
  game.invulnerableUntil=0;
  game.message="STAGE 1 (" + DIFFICULTIES[game.difficultyIdx].name + ")";
  game.messageUntil=performance.now()+1200;
  game.boss=null;
  game.bossMoveTimer=0;
  game.bossShootTimer=0;
  spawnCurrentStage();
}

function getSpeedMultiplier(){
  const diff = DIFFICULTIES[game.difficultyIdx];
  return Math.pow(1.03, game.stage - 1) * diff.speedMult;
}

function spawnCurrentStage(){
  game.minions = [];
  game.swords = [];
  if(game.stage === 5 || game.stage === 10 || game.stage === 15 || game.stage >= 20){
    spawnBoss();
  }else{
    stopBossMusic();
    spawnStage();
  }
}

function getRandomEnemyInterval(){
  const diff = DIFFICULTIES[game.difficultyIdx];
  const difficulty = getSpeedMultiplier();
  const minInterval = Math.max(400, (2500 / difficulty) * diff.delayMult);
  const maxInterval = Math.max(1200, (7000 / difficulty) * diff.delayMult);
  return minInterval + Math.random() * (maxInterval - minInterval);
}

function spawnStage(){
  game.enemies=[];
  game.bullets=[];
  game.boss=null;
  game.enemyDir=1;
  game.stageClearTimer=0;

  const rows = Math.min(2 + Math.floor((game.stage-1)/2), 4);
  const cols = Math.min(6 + Math.floor((game.stage-1)/3), 8);
  const gapX=32, gapY=23;
  const startX=(W-(cols-1)*gapX)/2-10;
  const startY=35;

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      game.enemies.push({
        x:startX+c*gapX,
        y:startY+r*gapY,
        w:20,h:15,
        alive:true,
        shootTimer: Math.random() * 1000,
        nextShootInterval: getRandomEnemyInterval()
      });
    }
  }

  game.message = "STAGE " + game.stage;
  game.messageUntil = performance.now()+1100;
}

function spawnBoss(){
  game.enemies=[];
  game.bullets=[];
  game.swords=[];
  game.stageClearTimer=0;
  game.bossMoveTimer=0;
  game.bossShootTimer=0;

  let hp = 40;
  let type = "undyne";
  let title = "UNDYNE THE UNDYING";

  if(game.stage === 10){
    hp = 80;
    type = "asgore";
    title = "ASGORE";
  } else if(game.stage === 15){
    hp = 120;
    type = "sans";
    title = "SANS";
  } else if(game.stage >= 20){
    hp = 180;
    type = "asriel";
    title = "ASRIEL - GOD OF HYPERDEATH";
  }

  // Scale HP for Bullet Hell
  if(game.difficultyIdx === 3) hp = Math.floor(hp * 1.3);

  game.boss={
    type: type,
    x:W/2-32,
    y:35,
    w:64,
    h:34,
    hp:hp,
    maxHp:hp,
    dir:1,
    speed:0.075 * getSpeedMultiplier(),
    spiralAngle: 0,
    attackPattern: 0,
    patternTimer: 0,
    isImmortal: false,
    immortalTimer: 0,
    spiralCycleCount: 0,
    phase2Spawned: false
  };

  game.nextBossShootInterval = 400 * DIFFICULTIES[game.difficultyIdx].delayMult;
  game.message="STAGE " + game.stage + " • " + title;
  game.messageUntil=performance.now()+1800;

  playBossMusic();
}

function shoot(){
  initAudio();
  if(game.screen==="menu" || game.screen==="gameover" || game.screen==="won"){
    resetGame();
    return;
  }
  if(game.screen!=="playing") return;

  const now = performance.now();
  if(now - game.lastPlayerShootTime < 100) return;

  if(game.bullets.filter(b=>b.owner==="player").length < 10){
    game.bullets.push({
      x:game.playerX+8,
      y:game.playerY,
      vx:0,
      vy:-0.32,
      owner:"player"
    });
    game.lastPlayerShootTime = now;
    sfx.shoot();
  }
}

function bossShoot(){
  if(!game.boss) return;
  const b = game.boss;
  const speed = getSpeedMultiplier();
  const diff = DIFFICULTIES[game.difficultyIdx];
  const centerX = b.x + b.w / 2;
  const centerY = b.y + b.h / 2;
  let baseDelay = 400 * diff.delayMult;

  if(b.type === "undyne"){
    const speedMult = b.isImmortal ? 1.4 : 1.0;
    let offsets = [-0.05, 0, 0.05];
    
    // Expand spear density based on difficulty
    if(game.difficultyIdx === 2) offsets = [-0.08, -0.04, 0, 0.04, 0.08];
    if(game.difficultyIdx === 3) offsets = [-0.12, -0.08, -0.04, 0, 0.04, 0.08, 0.12];

    for(const vx of offsets){
      game.bullets.push({
        x: centerX,
        y: b.y + b.h,
        vx: vx * speed * speedMult,
        vy: 0.24 * speed * speedMult,
        owner: "undyne_spear",
        w: 8,
        h: 20
      });
    }

    baseDelay = (b.isImmortal ? 220 : 350) * diff.delayMult;
    b.patternTimer++;
    if(b.patternTimer > 6){ b.patternTimer = 0; b.attackPattern++; }
  }

  else if(b.type === "asgore"){
    if(b.hp < b.maxHp * 0.5 && b.spiralCycleCount < 5){
      const numRays = game.difficultyIdx === 3 ? 20 : 12;
      for(let i=0; i<numRays; i++){
        const angle = b.spiralAngle + (i * (Math.PI * 2 / numRays));
        game.bullets.push({
          x: W / 2, y: H / 3,
          vx: Math.cos(angle) * 0.08 * speed,
          vy: Math.sin(angle) * 0.08 * speed,
          owner: "boss"
        });
      }
      b.spiralAngle += 0.25;
      b.patternTimer++;
      if(b.patternTimer > 8){
        b.patternTimer = 0;
        b.spiralCycleCount++;
      }
      baseDelay = 180 * diff.delayMult;
    } else {
      const px = game.playerX + 8, py = game.playerY + 6;
      const angle = Math.atan2(py - centerY, px - centerX);
      const offsets = game.difficultyIdx === 3 ? [-0.4, -0.2, 0, 0.2, 0.4] : [-0.2, 0, 0.2];
      for(let offset of offsets){
        game.bullets.push({
          x: centerX, y: centerY,
          vx: Math.cos(angle + offset) * 0.1 * speed,
          vy: Math.sin(angle + offset) * 0.1 * speed,
          owner: "boss"
        });
      }
      baseDelay = 500 * diff.delayMult;
      b.attackPattern++;
    }
  }

  else if(b.type === "sans"){
    if(b.attackPattern % 3 === 0){
      const count = game.difficultyIdx === 3 ? 5 : 2;
      for(let i = -count; i <= count; i++){
        game.bullets.push({
          x: centerX + i * 12, y: b.y + b.h,
          vx: i * 0.03, vy: 0.18 * speed,
          owner: "boss"
        });
      }
      baseDelay = 300 * diff.delayMult;
    } else if(b.attackPattern % 3 === 1){
      const gapIndex = Math.floor(Math.random() * 8);
      for(let i=0; i<10; i++){
        if(i !== gapIndex && (game.difficultyIdx < 2 || i !== gapIndex + 1)){
          game.bullets.push({
            x: i * 32 + 16, y: b.y + b.h,
            vx: 0, vy: 0.11 * speed,
            owner: "boss"
          });
        }
      }
      baseDelay = 600 * diff.delayMult;
    } else {
      const numRays = game.difficultyIdx === 3 ? 4 : 1;
      for(let i=0; i<numRays; i++){
        const angle = Math.random() * Math.PI * 2;
        game.bullets.push({
          x: centerX, y: centerY,
          vx: Math.cos(angle) * 0.14 * speed,
          vy: Math.sin(angle) * 0.14 * speed,
          owner: "boss"
        });
      }
      baseDelay = 220 * diff.delayMult;
    }
    b.patternTimer++;
    if(b.patternTimer > 5){ b.patternTimer = 0; b.attackPattern++; }
  }

  else if(b.type === "asriel"){
    if(b.attackPattern % 2 === 0){
      const drops = game.difficultyIdx === 3 ? 6 : 3;
      for(let i = 0; i < drops; i++){
        const dropX = Math.random() * (W - 20) + 10;
        game.bullets.push({
          x: dropX, y: 10,
          vx: (Math.random() - 0.5) * 0.04,
          vy: 0.12 * speed,
          owner: "asriel_star"
        });
      }
      baseDelay = 320 * diff.delayMult;
    } else {
      const numRays = game.difficultyIdx === 3 ? 16 : 10;
      for(let i=0; i<numRays; i++){
        const angle = (i / numRays) * Math.PI + Math.PI * 0.1;
        game.bullets.push({
          x: centerX, y: centerY,
          vx: Math.cos(angle) * 0.12 * speed,
          vy: Math.sin(angle) * 0.12 * speed,
          owner: "boss"
        });
      }
      baseDelay = 420 * diff.delayMult;
    }

    if(b.phase2Spawned && game.swords.length > 0){
      for(const sword of game.swords){
        const angle = Math.atan2(game.playerY - sword.y, game.playerX - sword.x);
        game.bullets.push({
          x: sword.x, y: sword.y,
          vx: Math.cos(angle) * 0.14 * speed,
          vy: Math.sin(angle) * 0.14 * speed,
          owner: "boss"
        });
      }
    }

    b.patternTimer++;
    if(b.patternTimer > 5){ b.patternTimer = 0; b.attackPattern++; }
  }

  game.nextBossShootInterval = baseDelay;
}

function hit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}

// Precise hitbox
function getPlayerHitbox(){
  return {
    x: game.playerX + 4,
    y: game.playerY + 2,
    w: 8,
    h: 8
  };
}

function loseLife(){
  const now=performance.now();
  if(now < game.invulnerableUntil) return;
  game.lives--;
  sfx.damage();
  game.invulnerableUntil=now+1200;
  game.playerX=W/2-8;
  game.bullets=game.bullets.filter(b=>b.owner==="player");
  game.message="HIT! LIVES: " + game.lives;
  game.messageUntil=now+900;

  if(game.lives<=0){
    game.lives=0;
    game.screen="gameover";
    stopBossMusic();
  }
}

function updateEnemies(dt){
  const speed = getSpeedMultiplier();

  const alive = game.enemies.filter(e => e.alive);
  if(alive.length){
    let minX = Math.min(...alive.map(e => e.x));
    let maxX = Math.max(...alive.map(e => e.x));
    const step = 0.035 * speed * dt * game.enemyDir;

    if(maxX >= W - 24 && game.enemyDir > 0){
      game.enemyDir = -1;
      alive.forEach(e => e.y += 6);
    } else if(minX <= 4 && game.enemyDir < 0){
      game.enemyDir = 1;
      alive.forEach(e => e.y += 6);
    } else {
      alive.forEach(e => e.x += step);
    }
  }

  for(const e of game.enemies){
    if(!e.alive) continue;
    e.shootTimer += dt;
    if(e.shootTimer >= e.nextShootInterval){
      e.shootTimer = 0;
      e.nextShootInterval = getRandomEnemyInterval();
      game.bullets.push({
        x: e.x + 10, y: e.y + 14,
        vx: 0, vy: 0.14 * speed,
        owner: "enemy"
      });
    }
  }
}

function updateMinions(dt){
  for(const m of game.minions){
    m.x += m.dir * 0.05 * dt;
    if(m.x < 10 || m.x > W - 20) m.dir *= -1;

    m.shootTimer += dt;
    if(m.shootTimer >= 1100 * DIFFICULTIES[game.difficultyIdx].delayMult){
      m.shootTimer = 0;
      game.bullets.push({
        x: m.x + 6, y: m.y + 10,
        vx: 0, vy: 0.12 * getSpeedMultiplier(),
        owner: "enemy"
      });
    }
  }
}

function updateSwords(dt){
  for(const s of game.swords){
    s.y = s.baseY + Math.sin(performance.now() * 0.003 + s.offset) * 12;
    s.x = s.baseX + Math.cos(performance.now() * 0.002 + s.offset) * 8;
  }
}

function killBoss(){
  game.boss=null;
  game.bullets=[];
  game.minions=[];
  game.swords=[];
  stopBossMusic();
  sfx.clear();
  game.stageClearTimer=performance.now()+1200;

  if(game.stage >= 20){
    game.screen = "won";
  } else {
    game.message="BOSS DEFEATED!";
    game.messageUntil=performance.now()+1100;
  }
}

function update(dt){
  if(game.screen!=="playing") return;

  if(inputs.left) game.playerX -= game.playerSpeed * dt;
  if(inputs.right) game.playerX += game.playerSpeed * dt;
  game.playerX = Math.max(0, Math.min(W - 16, game.playerX));

  if(game.boss){
    const b=game.boss;

    const moveSpeed = b.isImmortal ? b.speed * 2.0 : b.speed;
    b.x += b.dir * moveSpeed * dt;
    if(b.x <= 4){ 
      b.x=4; 
      b.dir=1; 
    } else if(b.x+b.w >= W-4){ 
      b.x=W-4-b.w; 
      b.dir=-1; 
    }

    if(b.isImmortal){
      b.immortalTimer -= dt;
      if(b.immortalTimer <= 0){
        killBoss();
        return;
      }
    }

    if(b.type === "sans" && b.hp < b.maxHp * 0.5 && !b.phase2Spawned){
      b.phase2Spawned = true;
      game.minions.push(
        { x: W/4, y: 75, w: 12, h: 10, dir: 1, shootTimer: 0 },
        { x: (W*3)/4, y: 75, w: 12, h: 10, dir: -1, shootTimer: 0 }
      );
      game.message = "ASSIST ALIENS SPAWNED!";
      game.messageUntil = performance.now() + 1500;
    }

    if(b.type === "asriel" && b.hp < b.maxHp * 0.5 && !b.phase2Spawned){
      b.phase2Spawned = true;
      game.swords = [
        { x: W / 4 - 10, y: 65, baseX: W / 4 - 10, baseY: 65, w: 12, h: 28, offset: 0 },
        { x: (W * 3) / 4 + 10, y: 65, baseX: (W * 3) / 4 + 10, baseY: 65, w: 12, h: 28, offset: Math.PI }
      ];
      game.message = "CHAOS SABERS SUMMONED!";
      game.messageUntil = performance.now() + 1500;
    }

    game.bossShootTimer += dt;
    if(game.bossShootTimer >= game.nextBossShootInterval){
      game.bossShootTimer = 0;
      bossShoot();
    }

    updateMinions(dt);
    updateSwords(dt);

    for(const bullet of game.bullets){
      bullet.x += (bullet.vx || 0) * dt;
      bullet.y += bullet.vy * dt;

      if(bullet.owner === "asriel_star" && bullet.y > H * 0.45 && !bullet.split){
        bullet.split = true;
        const count = game.difficultyIdx === 3 ? 6 : 4;
        for(let a=0; a<count; a++){
          const ang = a * (Math.PI * 2 / count);
          game.bullets.push({
            x: bullet.x, y: bullet.y,
            vx: Math.cos(ang) * 0.08 * getSpeedMultiplier(),
            vy: Math.sin(ang) * 0.08 * getSpeedMultiplier(),
            owner: "boss"
          });
        }
      }
    }
    game.bullets=game.bullets.filter(bullet=>bullet.x > -20 && bullet.x < W+20 && bullet.y > -20 && bullet.y < H+20);

    for(const bullet of game.bullets){
      if(bullet.owner!=="boss" && bullet.owner!=="enemy" && bullet.owner!=="asriel_star" && bullet.owner!=="undyne_spear") continue;
      
      let br;
      if(bullet.owner === "undyne_spear"){
        br = { x: bullet.x - 4, y: bullet.y, w: 8, h: 20 };
      } else {
        br = { x: bullet.x - 2, y: bullet.y - 2, w: 4, h: 4 };
      }

      const pr = getPlayerHitbox();
      if(hit(br,pr)){
        bullet.y=H+30;
        loseLife();
      }
    }

    for(const bullet of game.bullets){
      if(bullet.owner!=="player") continue;
      const br={x:bullet.x-1,y:bullet.y-5,w:2,h:7};
      if(hit(br,b)){
        bullet.y=-30;
        if(!b.isImmortal){
          b.hp--;
          game.score+=25;
          sfx.hit();

          if(b.hp<=0){
            if(b.type === "undyne" && !b.isImmortal){
              b.hp = 0;
              b.isImmortal = true;
              b.immortalTimer = 10000;
              game.message = "UNDYNE REFUSES TO DIE! (10s)";
              game.messageUntil = performance.now() + 2000;
            } else {
              killBoss();
            }
          }
        }
      }
    }

    if(game.boss){
      const pr = getPlayerHitbox();
      if(hit(pr,b)) loseLife();
    }

    if(game.stageClearTimer && performance.now()>=game.stageClearTimer){
      game.stageClearTimer=0;
      game.stage++;
      game.lives++;
      spawnCurrentStage();
    }

    return;
  }

  updateEnemies(dt);

  for(const b of game.bullets){
    b.x += (b.vx || 0) * dt;
    b.y += b.vy * dt;
  }
  game.bullets=game.bullets.filter(b=>b.x > -15 && b.x < W+15 && b.y > -15 && b.y < H+15);

  for(const e of game.enemies){
    if(!e.alive) continue;
    if(e.y+e.h >= game.playerY){ e.alive=false; loseLife(); continue; }
    const playerRect = getPlayerHitbox();
    if(hit(playerRect,e)){ e.alive=false; loseLife(); }
  }

  for(const b of game.bullets){
    if(b.owner!=="enemy") continue;
    const br={x:b.x-1,y:b.y-5,w:2,h:7};
    const pr = getPlayerHitbox();
    if(hit(br,pr)){ b.y=H+20; loseLife(); }
  }

  for(const b of game.bullets){
    if(b.owner!=="player") continue;
    const br={x:b.x-1,y:b.y-5,w:2,h:7};
    for(const e of game.enemies){
      if(!e.alive) continue;
      if(hit(br,e)){
        e.alive=false; b.y=-30; game.score+=10; sfx.hit(); break;
      }
    }
  }

  game.enemies=game.enemies.filter(e=>e.alive);

  if(game.enemies.length===0 && game.stageClearTimer===0){
    sfx.clear();
    game.stageClearTimer=performance.now()+1200;
    game.message="STAGE CLEAR!";
    game.messageUntil=performance.now()+1100;
  }

  if(game.stageClearTimer && performance.now()>=game.stageClearTimer){
    game.stageClearTimer=0;
    game.stage++;
    game.lives++;
    spawnCurrentStage();
  }
}

function clearScreen(){
  ctx.fillStyle="#02040b";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#24364d";
  for(let i=0;i<45;i++){
    const x=(i*73)%W, y=(i*47)%H;
    ctx.fillRect(x,y,1,1);
  }
}

function text(t,x,y,size=12,align="left",color="#fff"){
  ctx.fillStyle=color;
  ctx.font=`${size}px monospace`;
  ctx.textAlign=align;
  ctx.fillText(t,x,y);
}

function drawPlayer(){
  const flashing=performance.now()<game.invulnerableUntil && Math.floor(performance.now()/100)%2===0;
  if(flashing) return;
  const x=game.playerX,y=game.playerY;
  ctx.fillStyle="#70e8ff";
  ctx.beginPath();
  ctx.moveTo(x+8,y);
  ctx.lineTo(x+16,y+12);
  ctx.lineTo(x+11,y+10);
  ctx.lineTo(x+8,y+12);
  ctx.lineTo(x+5,y+10);
  ctx.lineTo(x,y+12);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle="#fff";
  ctx.fillRect(x+7,y+4,2,4);
}

function drawEnemy(x,y){
  ctx.fillStyle="#ff647c";
  ctx.fillRect(x+4,y,12,3);
  ctx.fillRect(x+2,y+3,16,8);
  ctx.fillRect(x,y+6,4,5);
  ctx.fillRect(x+16,y+6,4,5);
  ctx.fillRect(x+5,y+11,3,4);
  ctx.fillRect(x+12,y+11,3,4);
  ctx.fillStyle="#050814";
  ctx.fillRect(x+5,y+5,3,3);
  ctx.fillRect(x+12,y+5,3,3);
}

function drawMinions(){
  for(const m of game.minions){
    ctx.fillStyle="#00ffcc";
    ctx.fillRect(m.x, m.y, m.w, m.h);
  }
}

function drawSwords(){
  for(const s of game.swords){
    ctx.fillStyle="#ff2255";
    ctx.beginPath();
    ctx.moveTo(s.x + s.w / 2, s.y);
    ctx.lineTo(s.x + s.w, s.y + s.h * 0.7);
    ctx.lineTo(s.x + s.w * 0.7, s.y + s.h * 0.7);
    ctx.lineTo(s.x + s.w * 0.7, s.y + s.h);
    ctx.lineTo(s.x + s.w * 0.3, s.y + s.h);
    ctx.lineTo(s.x + s.w * 0.3, s.y + s.h * 0.7);
    ctx.lineTo(s.x, s.y + s.h * 0.7);
    ctx.closePath();
    ctx.fill();
  }
}

function drawBullet(b){
  if(b.owner==="undyne_spear"){
    ctx.fillStyle = "#00ffff";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + 20);
    ctx.lineTo(b.x - 4, b.y + 6);
    ctx.lineTo(b.x - 2, b.y + 6);
    ctx.lineTo(b.x - 2, b.y);
    ctx.lineTo(b.x + 2, b.y);
    ctx.lineTo(b.x + 2, b.y + 6);
    ctx.lineTo(b.x + 4, b.y + 6);
    ctx.closePath();
    ctx.fill();
  }else if(b.owner==="boss"){
    ctx.fillStyle="#ff8800";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }else if(b.owner==="asriel_star"){
    ctx.fillStyle="#ffff55";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  }else{
    ctx.fillStyle=b.owner==="player" ? "#fff28a" : "#ff647c";
    ctx.fillRect(b.x-1,b.y-5,2,7);
  }
}

function drawBoss(b){
  if(b.type === "undyne"){
    ctx.fillStyle = b.isImmortal ? "#ff0055" : "#00aaff";
  } else if(b.type === "asgore"){
    ctx.fillStyle = "#ffaa00";
  } else if(b.type === "sans"){
    ctx.fillStyle = "#ffffff";
  } else if(b.type === "asriel"){
    ctx.fillStyle = "#e6a1ff";
  }

  ctx.fillRect(b.x+8,b.y+5,b.w-16,b.h-10);
  ctx.fillRect(b.x+16,b.y,b.w-32,5);
  ctx.fillRect(b.x,b.y+12,10,12);
  ctx.fillRect(b.x+b.w-10,b.y+12,10,12);

  ctx.fillStyle="#000";
  ctx.fillRect(b.x+17,b.y+11,8,7);
  ctx.fillRect(b.x+b.w-25,b.y+11,8,7);

  if(!b.isImmortal){
    ctx.fillStyle="#42152b";
    ctx.fillRect(b.x,b.y-9,b.w,4);
    ctx.fillStyle="#ff647c";
    ctx.fillRect(b.x,b.y-9,b.w*(b.hp/b.maxHp),4);
  } else {
    text("IMMORTAL: " + Math.ceil(b.immortalTimer / 1000) + "s", b.x + b.w/2, b.y - 8, 10, "center");
  }
}

function drawHUD(){
  text("SCORE "+game.score,8,14,11);
  text("LIVES "+game.lives,160,14,11,"center");
  text("STAGE "+game.stage,312,14,11,"right");
  if(game.boss){
    text("BOSS HP "+game.boss.hp+"/"+game.boss.maxHp,160,229,10,"center");
  }else{
    text("ENEMIES "+game.enemies.length,160,229,10,"center");
  }
}

function overlay(title,subtitle){
  ctx.fillStyle="rgba(0,0,0,.72)";
  ctx.fillRect(0,0,W,H);
  text(title,160,90,24,"center");
  text(subtitle,160,120,12,"center");
}

function draw(){
  clearScreen();

  if(game.screen==="menu"){
    text("FARASHOOTERS",160,45,22,"center");
    text("UNDERTALE BOSS EDITION",160,62,10,"center");

    text("SELECT DIFFICULTY:",160,95,11,"center","#9ee7ff");

    DIFFICULTIES.forEach((d, i) => {
      const selected = i === game.difficultyIdx;
      const prefix = selected ? "► " : "  ";
      const suffix = selected ? " ◄" : "  ";
      const color = selected ? (i === 3 ? "#ff3355" : "#ffff55") : "#888888";
      text(prefix + d.name + suffix, 160, 120 + i * 20, 13, "center", color);
    });

    text("◀ / ▶ : CHANGE DIFFICULTY",160,210,9,"center");
    text("PRESS SHOOT TO START",160,225,11,"center","#ffffff");
  }else{
    drawHUD();
    for(const e of game.enemies) drawEnemy(e.x,e.y);
    drawMinions();
    drawSwords();
    if(game.boss) drawBoss(game.boss);
    for(const b of game.bullets) drawBullet(b);
    drawPlayer();

    if(game.messageUntil>performance.now()){
      text(game.message,160,110,16,"center");
    }
    if(game.screen==="gameover") overlay("GAME OVER","Press SHOOT to restart");
    if(game.screen==="won") overlay("YOU WIN!","Press SHOOT to return to menu");
  }
}

function loop(now){
  const dt=Math.min(40,now-game.lastTime);
  game.lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function setupTouch(btnId, key){
  const btn = document.getElementById(btnId);
  btn.addEventListener("pointerdown", e => { 
    e.preventDefault(); 
    initAudio(); 
    if(game.screen === "menu"){
      if(key === "left") game.difficultyIdx = (game.difficultyIdx + 3) % 4;
      if(key === "right") game.difficultyIdx = (game.difficultyIdx + 1) % 4;
    } else {
      inputs[key] = true; 
    }
  });
  btn.addEventListener("pointerup", e => { e.preventDefault(); inputs[key] = false; });
  btn.addEventListener("pointercancel", e => { e.preventDefault(); inputs[key] = false; });
  btn.addEventListener("pointerleave", e => { e.preventDefault(); inputs[key] = false; });
}

setupTouch("left", "left");
setupTouch("right", "right");
document.getElementById("shoot").addEventListener("pointerdown", e => { e.preventDefault(); shoot(); });
document.getElementById("connect").addEventListener("click", connectArduino);
document.getElementById("disconnect").addEventListener("click", disconnectArduino);

fullscreenBtn.addEventListener("click", async () => {
  initAudio();
  const elem = document.getElementById("app");
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) {
      await elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      await elem.webkitRequestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
  } else {
    if (document.exitFullscreen) {
      await document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      await document.webkitExitFullscreen();
    }
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
  }
});

document.addEventListener("keydown", e => {
  initAudio();
  if(e.key === "ArrowLeft"){ 
    e.preventDefault(); 
    if(game.screen === "menu"){
      game.difficultyIdx = (game.difficultyIdx + 3) % 4;
    } else {
      inputs.left = true; 
    }
  }
  if(e.key === "ArrowRight"){ 
    e.preventDefault(); 
    if(game.screen === "menu"){
      game.difficultyIdx = (game.difficultyIdx + 1) % 4;
    } else {
      inputs.right = true; 
    }
  }
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); shoot(); }
});

document.addEventListener("keyup", e => {
  if(e.key === "ArrowLeft"){ inputs.left = false; }
  if(e.key === "ArrowRight"){ inputs.right = false; }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
