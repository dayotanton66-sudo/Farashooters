<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GALACTIC INVADERS - 8-BIT ARCADE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#00f3ff;font-family:'Courier New',Courier,monospace;overflow:hidden;display:flex;justify-content:center;align-items:center}
#app{width:100%;height:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px;position:relative}
header{width:100%;text-align:center}
h1{margin:0;font-size:20px;letter-spacing:4px;color:#00f3ff;text-shadow:2px 2px #ff00ea}
#status{font-size:10px;color:#ff00ea;letter-spacing:2px;margin-top:2px}
#screenWrap{width:100%;flex:1;display:flex;justify-content:center;align-items:center;position:relative;min-height:0;margin:4px 0;overflow:hidden}
canvas{background:#000;border:4px solid #00f3ff;border-radius:2px;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;box-shadow:0 0 15px rgba(0,243,255,0.4);max-width:100%;max-height:100%;object-fit:contain}
.row{display:flex;justify-content:center;gap:6px;width:100%;flex-wrap:wrap}
button{border:2px solid #00f3ff;background:#050515;color:#00f3ff;padding:6px 10px;font-weight:bold;font-size:11px;font-family:'Courier New',Courier,monospace;cursor:pointer;box-shadow:2px 2px 0px #00f3ff;transition:all 0.05s ease}
button:active{transform:translate(2px,2px);box-shadow:0px 0px 0px #00f3ff;background:#00f3ff;color:#000}
.btn-danger{border-color:#ff0055;color:#ff0055;box-shadow:2px 2px 0px #ff0055}
.btn-danger:active{background:#ff0055;color:#000}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%;max-width:500px;margin-top:4px}
.controls button{font-size:14px;padding:8px 0}
#log{text-align:left;background:#000;border:1px solid #00f3ff;padding:4px;height:32px;overflow:hidden;font:9px 'Courier New',monospace;color:#00f3ff;width:100%;max-width:500px;opacity:0.8}
.hint{font-size:9px;color:#888;margin-top:2px}

/* Responsive Fullscreen Canvas Zoom Fit */
:fullscreen #app, :-webkit-full-screen #app{max-width:100vw;max-height:100vh;padding:0;background:#000;justify-content:center}
:fullscreen header, :-webkit-full-screen header,
:fullscreen .row, :-webkit-full-screen .row,
:fullscreen .controls, :-webkit-full-screen .controls,
:fullscreen .hint, :-webkit-full-screen .hint,
:fullscreen #log, :-webkit-full-screen #log {display:none !important}

:fullscreen #screenWrap, :-webkit-full-screen #screenWrap{width:100vw;height:100vh;margin:0;padding:0}
:fullscreen canvas, :-webkit-full-screen canvas{width:100vw;height:100vh;max-width:100vw;max-height:100vh;border:none;box-shadow:none;object-fit:contain}
</style>
</head>
<body>
<div id="app">
<header>
<h1>GALACTIC INVADERS</h1>
<div id="status">SYSTEM READY</div>
</header>
<div id="screenWrap"><canvas id="game" width="320" height="240"></canvas></div>
<div class="row">
<button id="connect">CONNECT</button>
<button id="disconnect">DISCONNECT</button>
<button id="menuBtn" class="btn-danger">PAUSE</button>
<button id="restartBtn">RESET</button>
<button id="fullscreenBtn">FULLSCREEN</button>
</div>
<div class="controls">
<button id="left">◀ LEFT</button>
<button id="shoot">● SHOOT</button>
<button id="right">RIGHT ▶</button>
</div>
<div class="hint">ARDUINO COMBO: HOLD LEFT + RIGHT + SHOOT FOR BOMB</div>
<div id="log">Awaiting hardware connection...</div>
</div>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
const statusEl=document.getElementById("status"),logEl=document.getElementById("log");
const W=canvas.width,H=canvas.height;

let port=null,reader=null,readLoopRunning=false,buffer="";
let audioCtx=null,musicTimer=null,musicStep=0;

const btnState={left:false,right:false,shoot:false};

const F={
  C2:65.41,D2:73.42,E2:82.41,F2:87.31,G2:98.00,A2:110.00,Bb2:116.54,
  C3:130.81,D3:146.83,Eb3:155.56,E3:164.81,F3:174.61,G3:196.00,A3:220.00,Bb3:233.08,
  C4:261.63,D4:293.66,Eb4:311.13,E4:329.63,F4:349.23,G4:392.00,A4:440.00,Bb4:466.16,
  C5:523.25,D5:587.33,Eb5:622.25,E5:659.25,F5:698.46,G5:783.99,A5:880.00,Bb5:932.33,R:0
};

const bossTracks={
  space_dreadnought:{
    tempo:110,
    lead:['C4','Eb4','G4','Bb4','C5','Bb4','G4','Eb4','D4','F4','Ab4','C5','D5','C5','Ab4','F4'],
    bass:['C2','C2','G2','C2','Eb2','Eb2','Bb2','Eb2','F2','F2','C3','F2','G2','G2','D3','G2']
  }
};

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}

function synthNote(freq,type,dur,vol){
  if(!audioCtx||freq<=0)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}

function synthNoise(dur,vol){
  if(!audioCtx)return;
  const bSize=audioCtx.sampleRate*dur;
  const buf=audioCtx.createBuffer(1,bSize,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bSize;i++)data[i]=Math.random()*2-1;
  const noise=audioCtx.createBufferSource();
  noise.buffer=buf;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+dur);
  noise.connect(g);g.connect(audioCtx.destination);
  noise.start();
}

const sfx={
  shoot(){initAudio();synthNote(800,'square',0.05,0.03);},
  invaderStep(p){initAudio();synthNote(p,'square',0.03,0.02);},
  hit(){initAudio();synthNoise(0.06,0.08);},
  damage(){initAudio();synthNote(80,'sawtooth',0.2,0.15);triggerShake(8);},
  clear(){
    initAudio();
    synthNote(F.C4,'square',0.08,0.05);
    setTimeout(()=>synthNote(F.E4,'square',0.08,0.05),80);
    setTimeout(()=>synthNote(F.G4,'square',0.08,0.05),160);
    setTimeout(()=>synthNote(F.C5,'square',0.2,0.05),240);
  },
  bomb(){
    initAudio();
    synthNoise(0.5,0.3);
    synthNote(60,'sawtooth',0.5,0.2);
    triggerShake(14);
  }
};

function playBossMusic(){
  initAudio();stopMusic();
  const t=bossTracks.space_dreadnought;
  musicStep=0;
  setStatus("BOSS ENGAGED");
  musicTimer=setInterval(()=>{
    const l=t.lead[musicStep%t.lead.length];
    const b=t.bass[musicStep%t.bass.length];
    if(l!=='R') synthNote(F[l],'sawtooth',0.1,0.03);
    if(b!=='R') synthNote(F[b],'square',0.12,0.04);
    musicStep++;
  },t.tempo);
}

function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

const DIFF=[{name:'EASY',speed:.8,lives:5},{name:'NORMAL',speed:1,lives:3},{name:'HARD',speed:1.3,lives:3}];
const inputs={left:false,right:false};

let shakeAmount=0;
function triggerShake(amt){shakeAmount=Math.max(shakeAmount,amt);}

const stars=Array.from({length:35},()=>({x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H),s:Math.random()>.5?1:2}));

const game={
  screen:'menu',
  overlayOption:0,
  difficultyIdx:1,
  score:0,highScore:0,lives:3,bombs:2,stage:1,cannons:1,combo:0,
  playerX:W/2-6,playerY:H-14,playerSpeed:.14,shield:false,
  lastShoot:0,bullets:[],enemies:[],particles:[],texts:[],drops:[],bunkers:[],
  invaderDir:1,invaderStepTimer:0,invaderStepInterval:500,invaderFrame:0,
  stageClearTimer:0,invulnerableUntil:0,
  message:'',messageUntil:0,boss:null,bossShootTimer:0
};

function setStatus(t){statusEl.textContent=t}
function log(t){logEl.textContent=t+'\n'+logEl.textContent;logEl.textContent=logEl.textContent.split('\n').slice(0,4).join('\n')}

function addParticle(x,y,color,vx,vy,life=16){
  game.particles.push({x:Math.floor(x),y:Math.floor(y),color,vx,vy,life,maxLife:life});
}

function addFloatingText(txt,x,y,color='#00f3ff'){
  game.texts.push({txt,x:Math.floor(x),y:Math.floor(y),vy:-0.2,life:20,color});
}

function resetGame(){
  stopMusic();
  game.screen='playing';
  game.overlayOption=0;
  game.score=0;game.combo=0;
  game.lives=DIFF[game.difficultyIdx].lives;
  game.bombs=2;game.stage=1;game.cannons=1;game.shield=false;
  game.playerX=W/2-6;game.playerY=H-14;
  game.lastShoot=0;
  game.bullets=[];game.enemies=[];game.particles=[];game.texts=[];game.drops=[];game.bunkers=[];
  game.stageClearTimer=0;game.invulnerableUntil=0;game.boss=null;
  game.message='STAGE 1';game.messageUntil=performance.now()+1000;
  spawnBunkers();
  spawnCurrentStage();
}

function returnToMenu(){
  stopMusic();
  game.screen='menu';
  game.overlayOption=0;
  game.bullets=[];game.enemies=[];game.boss=null;game.particles=[];game.drops=[];game.bunkers=[];
  inputs.left=inputs.right=false;
  setStatus('SYSTEM READY');
}

function togglePause(){
  if(game.screen==='playing'){
    game.screen='paused';
    game.overlayOption=0;
  }else if(game.screen==='paused'){
    game.screen='playing';
  }
}

function spawnBunkers(){
  game.bunkers=[];
  const count=4,width=20,height=8,gap=(W-count*width)/(count+1);
  for(let i=0;i<count;i++){
    const bx=gap+(width+gap)*i,by=H-38;
    for(let bw=0;bw<width;bw+=2){
      for(let bh=0;bh<height;bh+=2){
        if(bh<2&&(bw<2||bw>=width-2))continue;
        game.bunkers.push({x:Math.floor(bx+bw),y:Math.floor(by+bh),w:2,h:2,hp:2});
      }
    }
  }
}

function spawnCurrentStage(){if(game.stage%5===0)spawnBoss();else spawnStage()}

function spawnStage(){
  game.enemies=[];game.bullets=[];game.boss=null;game.invaderDir=1;
  stopMusic();
  setStatus('STAGE '+game.stage);
  const rows=Math.min(3+Math.floor((game.stage-1)/2),5),cols=8,gapX=20,gapY=12,startX=(W-(cols-1)*gapX)/2-6;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    let type=r===0?'top':r<3?'middle':'bottom';
    game.enemies.push({x:Math.floor(startX+c*gapX),y:20+r*gapY,w:12,h:8,type,hp:1,alive:true});
  }
  game.invaderStepInterval=Math.max(100,500-game.stage*25);
}

function spawnBoss(){
  game.enemies=[];game.bullets=[];
  const hp=150+game.stage*30;
  game.boss={type:'space_dreadnought',title:'BOSS',x:W/2-20,y:20,w:40,h:18,hp,maxHp:hp,dir:1,speed:.06*DIFF[game.difficultyIdx].speed};
  game.bossShootTimer=0;
  game.message='WARNING: BOSS';
  game.messageUntil=performance.now()+1500;
  playBossMusic();
}

function checkComboBomb(){
  if(btnState.left && btnState.right && btnState.shoot){
    handleBomb();
  }
}

function handleAction(){
  initAudio();
  if(game.screen==='menu'){
    resetGame();
  }else if(game.screen==='gameover'||game.screen==='won'||game.screen==='paused'){
    if(game.overlayOption===0) resetGame();
    else returnToMenu();
  }else if(game.screen==='playing'){
    shoot();
  }
}

function handleBomb(){
  initAudio();
  if(game.screen!=='playing'||game.bombs<=0)return;
  game.bombs--;
  sfx.bomb();
  game.bullets=[];
  for(let i=0;i<25;i++)addParticle(Math.random()*W,Math.random()*H,'#00f3ff',(Math.random()-.5)*4,(Math.random()-.5)*4,20);
  if(game.boss){
    game.boss.hp=Math.max(1,game.boss.hp-35);
    addFloatingText('-35',game.boss.x+game.boss.w/2,game.boss.y,'#ff00ea');
  }
  for(const e of game.enemies){
    e.hp--;if(e.hp<=0)e.alive=false;
  }
}

function handleLeft(){
  initAudio();
  if(game.screen==='menu'){
    game.difficultyIdx=(game.difficultyIdx+2)%3;
  }else if(game.screen==='gameover'||game.screen==='won'||game.screen==='paused'){
    game.overlayOption=0;
  }else{
    inputs.left=true;inputs.right=false;
  }
}

function handleRight(){
  initAudio();
  if(game.screen==='menu'){
    game.difficultyIdx=(game.difficultyIdx+1)%3;
  }else if(game.screen==='gameover'||game.screen==='won'||game.screen==='paused'){
    game.overlayOption=1;
  }else{
    inputs.right=true;inputs.left=false;
  }
}

function shoot(){
  if(game.screen!=='playing')return;
  const now=performance.now();
  if(now-game.lastShoot<140)return;
  if(game.bullets.filter(b=>b.owner==='player').length>=10)return;
  const cx=Math.floor(game.playerX+5),cy=game.playerY;
  if(game.cannons===1){
    game.bullets.push({x:cx,y:cy,vx:0,vy:-.35,owner:'player'});
  }else{
    game.bullets.push({x:cx-3,y:cy,vx:0,vy:-.35,owner:'player'},{x:cx+3,y:cy,vx:0,vy:-.35,owner:'player'});
  }
  game.lastShoot=now;
  sfx.shoot();
}

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function loseLife(){
  const now=performance.now();
  if(now<game.invulnerableUntil||game.screen!=='playing')return;
  if(game.shield){
    game.shield=false;
    sfx.hit();
    game.invulnerableUntil=now+600;
    return;
  }
  game.lives--;
  sfx.damage();
  game.invulnerableUntil=now+1200;
  if(game.lives<=0){
    stopMusic();
    if(game.score>game.highScore)game.highScore=game.score;
    game.screen='gameover';
    game.overlayOption=0;
  }
}

function spawnDrop(x,y){
  if(Math.random()>.2)return;
  const types=['cannon','shield','bomb'];
  const type=types[Math.floor(Math.random()*types.length)];
  game.drops.push({x:Math.floor(x),y:Math.floor(y),w:6,h:6,type,vy:0.04});
}

function updateInvaders(dt){
  const alive=game.enemies.filter(e=>e.alive);
  if(!alive.length||game.boss)return;

  game.invaderStepTimer+=dt;
  const currentInterval=Math.max(50,game.invaderStepInterval*(alive.length/24));

  if(game.invaderStepTimer>=currentInterval){
    game.invaderStepTimer=0;
    game.invaderFrame=1-game.invaderFrame;

    sfx.invaderStep(game.invaderFrame?160:120);

    let shiftDown=false;
    const minX=Math.min(...alive.map(e=>e.x));
    const maxX=Math.max(...alive.map(e=>e.x));

    if((maxX>=W-16&&game.invaderDir>0)||(minX<=4&&game.invaderDir<0)){
      game.invaderDir=-game.invaderDir;
      shiftDown=true;
    }

    alive.forEach(e=>{
      if(shiftDown) e.y+=6;
      else e.x+=game.invaderDir*4;
    });

    if(Math.random()<.5){
      const shooter=alive[Math.floor(Math.random()*alive.length)];
      game.bullets.push({x:shooter.x+shooter.w/2,y:shooter.y+shooter.h,vx:0,vy:.1*DIFF[game.difficultyIdx].speed,owner:'invader'});
    }
  }
}

function updateBoss(dt){
  const b=game.boss;if(!b)return;
  b.x+=b.dir*b.speed*dt;
  if(b.x<=4){b.x=4;b.dir=1}else if(b.x+b.w>=W-4){b.x=W-4-b.w;b.dir=-1}

  game.bossShootTimer+=dt;
  if(game.bossShootTimer>=1500){
    game.bossShootTimer=0;
    const cx=b.x+b.w/2,cy=b.y+b.h;
    for(const vx of[-.06,0,.06]){
      game.bullets.push({x:cx,y:cy,vx:vx*DIFF[game.difficultyIdx].speed,vy:.12*DIFF[game.difficultyIdx].speed,owner:'boss'});
    }
  }
}

function update(dt){
  if(shakeAmount>0)shakeAmount=Math.max(0,shakeAmount-dt*0.04);

  for(const st of stars){
    st.y+=st.s*0.05*dt;
    if(st.y>H){st.y=0;st.x=Math.floor(Math.random()*W);}
  }

  if(game.screen!=='playing')return;

  if(inputs.left)game.playerX-=game.playerSpeed*dt;
  if(inputs.right)game.playerX+=game.playerSpeed*dt;
  game.playerX=Math.max(2,Math.min(W-12,game.playerX));

  const p={x:Math.floor(game.playerX),y:game.playerY,w:10,h:8};

  for(let i=game.drops.length-1;i>=0;i--){
    const d=game.drops[i];
    d.y+=d.vy*dt;
    if(hit(p,d)){
      if(d.type==='cannon')game.cannons=2;
      else if(d.type==='shield')game.shield=true;
      else if(d.type==='bomb')game.bombs++;
      game.drops.splice(i,1);
    }else if(d.y>H)game.drops.splice(i,1);
  }

  updateInvaders(dt);
  updateBoss(dt);

  for(const b of game.bullets){
    b.x+=(b.vx||0)*dt;
    b.y+=b.vy*dt;
  }
  game.bullets=game.bullets.filter(b=>b.x>-4&&b.x<W+4&&b.y>-4&&b.y<H+4);

  for(const b of game.bullets){
    const br={x:b.x-1,y:b.y-1,w:2,h:2};
    for(let i=game.bunkers.length-1;i>=0;i--){
      const bk=game.bunkers[i];
      if(hit(br,bk)){
        b.y=-20;bk.hp--;
        if(bk.hp<=0)game.bunkers.splice(i,1);
        break;
      }
    }
  }

  for(const b of game.bullets){
    if(b.owner==='player')continue;
    if(hit({x:b.x-1,y:b.y-1,w:2,h:3},p))loseLife();
  }

  for(const b of game.bullets){
    if(b.owner!=='player')continue;
    const r={x:b.x-1,y:b.y-2,w:2,h:4};

    if(game.boss&&hit(r,game.boss)){
      b.y=-20;game.boss.hp--;game.score+=10;
      sfx.hit();
      if(game.boss.hp<=0){
        game.boss=null;stopMusic();sfx.clear();
        game.stageClearTimer=performance.now()+1200;
      }
      continue;
    }

    for(const e of game.enemies){
      if(!e.alive)continue;
      if(hit(r,e)){
        b.y=-20;e.hp--;sfx.hit();
        if(e.hp<=0){
          e.alive=false;
          game.score+=20;
          spawnDrop(e.x+e.w/2,e.y+e.h/2);
          for(let pI=0;pI<4;pI++)addParticle(e.x+4,e.y+4,'#00f3ff',(Math.random()-.5)*2,(Math.random()-.5)*2,10);
        }
        break;
      }
    }
  }

  for(const e of game.enemies){
    if(e.alive&&e.y+e.h>=game.playerY){
      e.alive=false;loseLife();
    }
  }
  game.enemies=game.enemies.filter(e=>e.alive);

  if(!game.boss&&game.enemies.length===0&&game.stageClearTimer===0){
    sfx.clear();
    game.stageClearTimer=performance.now()+1000;
  }
  if(game.stageClearTimer&&performance.now()>=game.stageClearTimer){
    game.stageClearTimer=0;game.stage++;spawnCurrentStage();
  }

  for(let i=game.particles.length-1;i>=0;i--){
    const pt=game.particles[i];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;
    if(pt.life<=0)game.particles.splice(i,1);
  }
  for(let i=game.texts.length-1;i>=0;i--){
    const ft=game.texts[i];
    ft.y+=ft.vy;ft.life--;
    if(ft.life<=0)game.texts.splice(i,1);
  }
}

function drawPixelSprite(x,y,map,color,scale=1){
  ctx.fillStyle=color;
  for(let r=0;r<map.length;r++){
    for(let c=0;c<map[r].length;c++){
      if(map[r][c]==='1'){
        ctx.fillRect(Math.floor(x+c*scale),Math.floor(y+r*scale),scale,scale);
      }
    }
  }
}

const SPRITES={
  player:[
    "00011000",
    "00111100",
    "01111110",
    "11111111"
  ],
  invaderTop:[
    ["00111100","01111110","11011011","11111111","00100100","01011010"],
    ["00111100","01111110","11011011","11111111","01000010","10000001"]
  ],
  invaderMid:[
    ["01000010","00111100","01111110","11011011","11111111","01000010"],
    ["00000000","00111100","01111110","11011011","11111111","00100100"]
  ]
};

function text(t,x,y,size=8,align='left',color='#00f3ff'){
  ctx.fillStyle=color;ctx.font=size+'px monospace';ctx.textAlign=align;ctx.fillText(t,Math.floor(x),Math.floor(y));
}

function drawModal(title,sub,opt1,opt2){
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#00f3ff';ctx.lineWidth=2;
  ctx.strokeRect(20,20,W-40,H-40);

  text(title,W/2,50,12,'center','#00f3ff');
  text(sub,W/2,70,8,'center','#ff00ea');

  const b1Sel=game.overlayOption===0;
  ctx.strokeStyle=b1Sel?'#ff00ea':'#00f3ff';
  ctx.strokeRect(35,110,80,24);
  text(opt1,75,125,8,'center',b1Sel?'#ff00ea':'#00f3ff');

  const b2Sel=game.overlayOption===1;
  ctx.strokeStyle=b2Sel?'#ff00ea':'#00f3ff';
  ctx.strokeRect(135,110,80,24);
  text(opt2,175,125,8,'center',b2Sel?'#ff00ea':'#00f3ff');
}

function draw(){
  ctx.save();
  if(shakeAmount>0){
    ctx.translate(Math.floor((Math.random()-.5)*shakeAmount),Math.floor((Math.random()-.5)*shakeAmount));
  }

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffffff';
  for(const st of stars) ctx.fillRect(st.x,st.y,st.s,st.s);

  if(game.screen==='menu'){
    ctx.strokeStyle='#00f3ff';ctx.lineWidth=2;ctx.strokeRect(10,10,W-20,H-20);
    text('GALACTIC INVADERS',W/2,45,14,'center','#00f3ff');
    text('8-BIT HARDWARE EDITION',W/2,62,8,'center','#ff00ea');

    text('DIFFICULTY:',W/2,100,8,'center','#ffffff');
    text('< '+DIFF[game.difficultyIdx].name+' >',W/2,118,10,'center','#00f3ff');

    text('HI-SCORE: '+game.highScore,W/2,150,8,'center','#a100ff');
    text('HOLD LEFT+RIGHT+SHOOT FOR BOMB',W/2,180,7,'center','#ff00ea');
    text('PRESS SHOOT TO START',W/2,205,8,'center','#00f3ff');
    ctx.restore();
    return;
  }

  text('SC:'+game.score,6,10,8,'left','#00f3ff');
  text('BOMB:'+game.bombs,W/2,10,8,'center','#ff00ea');
  text('ST:'+game.stage,W-6,10,8,'right','#00f3ff');

  for(let i=0;i<game.lives;i++){
    ctx.fillStyle='#00f3ff';
    ctx.fillRect(6+i*8,H-6,6,3);
  }

  for(const bk of game.bunkers){
    ctx.fillStyle=bk.hp===2?'#00f3ff':'#ff00ea';
    ctx.fillRect(bk.x,bk.y,bk.w,bk.h);
  }

  for(const d of game.drops){
    ctx.fillStyle=d.type==='cannon'?'#00f3ff':d.type==='shield'?'#a100ff':'#ff00ea';
    ctx.fillRect(d.x,d.y,d.w,d.h);
  }

  for(const b of game.bullets){
    ctx.fillStyle=b.owner==='player'?'#00f3ff':'#ff00ea';
    ctx.fillRect(Math.floor(b.x),Math.floor(b.y),2,4);
  }

  for(const e of game.enemies){
    if(!e.alive)continue;
    const f=game.invaderFrame;
    const spr=e.type==='top'?SPRITES.invaderTop[f]:SPRITES.invaderMid[f];
    drawPixelSprite(e.x,e.y,spr,e.type==='top'?'#ff00ea':'#00f3ff',1.2);
  }

  if(game.boss){
    const b=game.boss;
    ctx.fillStyle='#ff00ea';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='#00f3ff';
    ctx.fillRect(b.x+4,b.y+4,8,4);ctx.fillRect(b.x+b.w-12,b.y+4,8,4);
    ctx.fillStyle='#ff00ea';
    ctx.fillRect(40,14,Math.max(0,240*(b.hp/b.maxHp)),2);
  }

  if(performance.now()>=game.invulnerableUntil||Math.floor(performance.now()/60)%2===0){
    drawPixelSprite(game.playerX,game.playerY,SPRITES.player,'#00f3ff',1.2);
    if(game.shield){
      ctx.strokeStyle='#ff00ea';ctx.strokeRect(game.playerX-2,game.playerY-2,14,10);
    }
  }

  for(const pt of game.particles){
    ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x,pt.y,2,2);
  }

  for(const ft of game.texts) text(ft.txt,ft.x,ft.y,8,'center',ft.color);

  if(game.screen==='gameover'){
    drawModal('GAME OVER',`SCORE: ${game.score}`,'RETRY','MENU');
  }else if(game.screen==='paused'){
    drawModal('PAUSED','GAME PAUSED','RESUME','MENU');
  }

  ctx.fillStyle='rgba(0,0,0,0.15)';
  for(let i=0;i<H;i+=2) ctx.fillRect(0,i,W,1);

  ctx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(30,now-last);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

async function connectArduino(){
  initAudio();
  if(!('serial' in navigator)){setStatus('SERIAL NOT SUPPORTED');return}
  try{
    setStatus('CONNECTING...');
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    setStatus('HARDWARE CONNECTED');
    resetGame();
    readLoop();
  }catch(e){
    setStatus('CONN FAILED');
    log('ERR: '+e.message);
  }
}

async function disconnectArduino(){
  try{if(reader){await reader.cancel();reader.releaseLock();reader=null}}catch(e){}
  try{if(port)await port.close()}catch(e){}
  port=null;
  setStatus('DISCONNECTED');
}

async function readLoop(){
  if(!port||!port.readable||readLoopRunning)return;
  readLoopRunning=true;
  const decoder=new TextDecoder();
  try{
    reader=port.readable.getReader();
    while(true){
      const r=await reader.read();
      if(r.done)break;
      buffer+=decoder.decode(r.value,{stream:true});
      const lines=buffer.split(/\r?\n/);
      buffer=lines.pop()||'';
      for(const raw of lines){
        const cmd=raw.trim().toUpperCase();
        if(cmd==='BOMB_COMBO'||cmd==='BOMB'){
          handleBomb();
        }else if(cmd==='LEFT_DOWN'){
          btnState.left=true;handleLeft();checkComboBomb();
        }else if(cmd==='LEFT_UP'){
          btnState.left=false;inputs.left=false;
        }else if(cmd==='RIGHT_DOWN'){
          btnState.right=true;handleRight();checkComboBomb();
        }else if(cmd==='RIGHT_UP'){
          btnState.right=false;inputs.right=false;
        }else if(cmd==='SHOOT_DOWN'){
          btnState.shoot=true;handleAction();checkComboBomb();
        }else if(cmd==='SHOOT_UP'){
          btnState.shoot=false;
        }
        else if(cmd==='LEFT'){ handleLeft(); }
        else if(cmd==='RIGHT'){ handleRight(); }
        else if(cmd==='SHOOT'){ handleAction(); }
        else if(cmd==='RELEASE'){ inputs.left=inputs.right=false; btnState.left=btnState.right=btnState.shoot=false; }
      }
    }
  }catch(e){
    if(port)log('READ ERR: '+e.message);
  }finally{
    if(reader)reader.releaseLock();
    reader=null;readLoopRunning=false;
  }
}

function bindHold(el,onDown,onUp){
  el.addEventListener('pointerdown',e=>{e.preventDefault();onDown();});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{
    e.preventDefault();if(onUp)onUp();
  }));
}

bindHold(document.getElementById('left'),()=>{btnState.left=true;handleLeft();checkComboBomb();},()=>{btnState.left=false;inputs.left=false;});
bindHold(document.getElementById('right'),()=>{btnState.right=true;handleRight();checkComboBomb();},()=>{btnState.right=false;inputs.right=false;});
bindHold(document.getElementById('shoot'),()=>{btnState.shoot=true;handleAction();checkComboBomb();},()=>{btnState.shoot=false;});

document.getElementById('connect').onclick=connectArduino;
document.getElementById('disconnect').onclick=disconnectArduino;
document.getElementById('menuBtn').onclick=togglePause;
document.getElementById('restartBtn').onclick=resetGame;

// Fullscreen Zoom Handler
document.getElementById('fullscreenBtn').onclick=async()=>{
  const target=document.getElementById('app');
  try{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      if(target.requestFullscreen) await target.requestFullscreen();
      else if(target.webkitRequestFullscreen) await target.webkitRequestFullscreen();
    }else{
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) await document.webkitExitFullscreen();
    }
  }catch(e){log('Fullscreen error');}
};

window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){btnState.left=true;handleLeft();}
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){btnState.right=true;handleRight();}
  if(e.code==='Space'||e.key.toLowerCase()==='z'){btnState.shoot=true;handleAction();}
  if(e.key==='Escape') togglePause();
  checkComboBomb();
});

window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){btnState.left=false;inputs.left=false;}
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){btnState.right=false;inputs.right=false;}
  if(e.code==='Space'||e.key.toLowerCase()==='z'){btnState.shoot=false;}
});

canvas.addEventListener('pointerdown',e=>{handleAction();});
</script>
